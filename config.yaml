fps: 30
build_up_sec: 5
min_len_sec: 10
max_len_sec: 25
peak:
  rms_window_sec: 0.5
  threshold_k: 2.4
  min_gap_sec: 6
  max_clips: null
reaction:
  margin_db: 6
  hold_sec: 2
  post_goal_sec: 2.5    # hold Cam A this long past the goal before the angle cut
  min_reaction_sec: 2   # guarantee the reaction segment is at least this long
  min_angle_switch_sec: 3 # hide angle switches shorter than this; keep the goal cam only
  tail_sec: 2           # extra seconds appended only when celebration audio actually extends
crossfade_sec: 0.5
hw_encode: true            # Apple VideoToolbox H.264 (실측 ~2x 빠름; false = libx264)
output_width: 1920
output_height: 1080
# bgm_path: data/bgm.mp3   # optional background music mixed under highlight_all.mp4
bgm_volume: 0.15           # bgm level (crowd audio stays at full volume)
vision:                 # goal LABELLING via sparse frames -- marks which clips are goals
                        # (never removes clips; the reel keeps saves/near-misses). off by default
  enabled: false
  pre_sec: 3            # covers the shot (~1-2s before the cheer peak)
  post_sec: 5          # covers ball-in + walk-back to center (restart = goal cue)
  fps: 2
  frame_height: 360
  model: claude-sonnet-5   # VLM for "goal celebration?" (claude-haiku-4-5 = cheaper)
  min_confidence: 0.0      # keep a goal only if verdict confidence >= this (e.g. 0.9 = stricter)
locate:                   # net-ROI goal localization (fixed cameras); off by default
  enabled: true
  rois_path: net_rois.json   # from editor/calibrate.html: {camKeySubstring: [x,y,w,h] normalized}
  pre_sec: 2.5             # search window is biased BEFORE onset (ball-in precedes the cheer)
  post_sec: 0.5
  fps: 10
  min_prominence: 6        # net motion spike must exceed window median by this many MADs
  workers: 6               # 동시에 돌릴 ffmpeg 탐색 개수. 탐색끼리는 독립이라
                           # 겹쳐 돌릴 수 있다. ffmpeg 자체가 이미 멀티스레드라
                           # 코어 수만큼 빨라지지는 않는다 — 10코어에서 1/4/6/8 을
                           # 재보니 6이 가장 좋았고 1.7배였다.
  weak_audio_max_probes: 20  # 약한 오디오 후보 중 소리 큰 순으로 몇 개까지 탐색할지.
                           # 후보 하나 건지는 데 가장 비싼 단계다 — 실측한 경기에서
                           # 69번 탐색에 40초를 쓰고 1개를 건졌고, 그 1개가 69개 중
                           # 소리 1위였다. 0 이면 상한 없음(전부 탐색).
  angle_from_roi: false    # 골망 ROI 로 '어느 카메라를 보여줄지'까지 정할지.
                           # 기본 꺼짐 — 두 ROI 는 같은 것을 재지 않는다. 카메라마다
                           # 자기 옆 골대가 화면을 채우므로, 그 앞에 선 키퍼의 움직임이
                           # 먼 골망에 공이 들어가는 것보다 항상 크게 잡힌다. 눈으로
                           # 확인한 5건에서 가까운 골대 쪽 카메라가 모션은 매번 이기고
                           # 매번 틀렸으며, 소리는 5건 다 맞혔다. ROI 는 '언제'를,
                           # 소리는 '어디를 볼지'를 정한다. 키퍼가 빠지도록 상자를
                           # 좁게 잡았다면 켜볼 만하다.
  max_lead_sec: 9          # 골망 히트가 함성보다 이만큼 앞서면 이 골로 인정하지 않는다.
                           # 관중은 공을 한 박자 뒤에 따라오므로, 훨씬 앞선 히트는
                           # 직전 플레이의 네트 움직임이다. 그걸 집으면 클립이 골을
                           # 벗어나고 앵글도 그쪽으로 끌려간다. 실측(2026-08-15):
                           # 정상 보정은 앵커를 중앙값 3.8초 옮기는데, 눈으로 확인한
                           # 오답 3건은 9.4 / 10.1 / 11.6초였다.
  scan_enabled: false      # ROI-only 조용한-골 스캔 — 이 구장 지오메트리에선 비활성 권장.
                           # 실측 결론(2026-07-16): 측면 카메라 + 골대 뒤 상주 여분공 때문에
                           # 네트 영역의 시각 신호로는 골/정크 분리 불가 (모션량·모양특징·
                           # 정지공·공유도 VLM·시퀀스 VLM 모두 recall≤20%). 골 감지는 오디오
                           # (+V3 필드 비전 확인)가 담당. 골대 뒤 캠을 추가하면 재활성 가치 있음.
  scan_min_prominence: 10  # stricter ROI-only threshold for quiet goals with weak/no cheer
  scan_fps: 2              # cheaper full-game ROI-only scan rate
  scan_frame_px: 32        # cheaper full-game ROI-only frame size
  scan_max_impulse_sec: 1.2   # 네트 히트=짧은 임펄스; 지속 모션(키퍼 등)은 컷
  scan_max_candidates: 40  # 러프 후보 상위 N개만 정밀검증 (비용 상한)
  scan_verify: vlm         # ROI-only 후보 검증: shape(무료) | vlm(네트 크롭 AI 판정, API 키 필요)
  scan_verify_model: claude-haiku-4-5-20251001  # 판정용 저비용 모델 (이벤트당 크롭 3장)
  weak_audio_k: 2.0        # 정식 피크 미만이어도 보조 카메라 오디오가 이 정도 튀면 ROI로 검증
  weak_audio_min_confidence: 40 # 약한 오디오 후보를 살릴 최소 ROI 모션 신뢰도
  weak_audio_max_lead_sec: 5    # ROI 히트가 약한 오디오보다 너무 앞서면 stale 후보로 간주
# main_cam: camA   # cam id to use as Cam A / goal-detection + buildup reference (default: first cam alphabetically)

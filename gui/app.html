<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoPitch 스튜디오</title>
<style>
  :root{--bg:#0f1216;--panel:#191f27;--line:#2a323d;--fg:#e7ebf0;--mut:#8b95a3;--accent:#4ea1ff;--ok:#37d67a;--drop:#ff6b6b;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;}
  header h1{font-size:15px;margin:0 14px 0 0;}
  .tab{background:none;border:none;color:var(--mut);padding:8px 12px;cursor:pointer;border-radius:7px;font-size:13px;}
  .tab.on{background:#232b34;color:var(--fg);}
  #root{margin-left:auto;color:var(--mut);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{max-width:1000px;margin:0 auto;padding:16px;}
  .btn{background:#232a33;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--accent);} .btn.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:600;}
  .btn.sm{padding:3px 7px;font-size:12px;} .btn:disabled{opacity:.4;cursor:default;}
  input,select{background:#0e1116;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;}
  input[type=number]{width:80px;font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .mut{color:var(--mut);} .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;}
  canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;background:#000;display:block;}
  video{width:100%;max-height:300px;background:#000;border-radius:8px;}
  .tl{position:relative;height:40px;background:#0b0e12;border:1px solid var(--line);border-radius:6px;margin-top:8px;touch-action:none;cursor:pointer;}
  .tl .blk{position:absolute;top:6px;bottom:6px;border-radius:4px;font-size:10px;line-height:1;color:#e8eef5;overflow:hidden;padding:3px 5px;pointer-events:none;white-space:nowrap;}
  .tl .b0{background:rgba(47,93,138,.55);} .tl .b1{background:rgba(138,90,47,.55);}
  .tl .wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:none;background:transparent;border-radius:6px;}
  .tl .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;}
  .tl .hd{position:absolute;top:-4px;bottom:-4px;width:10px;margin-left:-5px;cursor:ew-resize;border-radius:3px;background:var(--accent);}
  .tl .hd.hcut{background:var(--ok);}
  .prog{height:8px;background:#0e1116;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
  .clip:focus{outline:1px solid var(--accent);}
  code{background:#0e1116;padding:1px 5px;border-radius:4px;border:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;margin-top:8px;} td,th{border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left;}
  .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin:3px 0;}
  .clip.excluded{opacity:.45;}
  .t{color:var(--accent);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <h1>🎬 autoPitch 스튜디오</h1>
  <button class="tab on" data-tab="setup">① 설정</button>
  <button class="tab" data-tab="cal">② 골 ROI</button>
  <button class="tab" data-tab="edit">③ 편집·렌더</button>
  <span id="root">–</span>
</header>
<main>
  <section id="setup"></section>
  <section id="cal" hidden></section>
  <section id="edit" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(p,o)=>{const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;};
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const round=(n,d=2)=>Math.round(n*10**d)/10**d;
let STATE={root:'',games:[],rois_exists:false};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['setup','cal','edit'].forEach(id=>$('#'+id).hidden = id!==b.dataset.tab);
  if(b.dataset.tab==='cal') renderCal();
  if(b.dataset.tab==='edit') renderEdit();
});

async function loadState(){ STATE=await api('/api/state'); $('#root').textContent='📁 '+STATE.root; renderSetup(); }

/* ---------- ① SETUP ---------- */
function renderSetup(){
  const g=STATE.games;
  $('#setup').innerHTML=`
    <div class="card">
      <div class="row"><b>프로젝트 루트</b></div>
      <div class="row"><input id="rootIn" style="flex:1" value="${STATE.root}">
        <button class="btn" id="setRoot">설정</button></div>
      <div class="mut">루트에 <code>data/raw/cam1</code>, <code>data/raw/cam2</code>, <code>config.yaml</code>이 있어야 합니다.</div>
    </div>
    <div class="card">
      <div class="row"><b>감지된 경기</b> <span class="mut">(촬영시각 페어링)</span> ${STATE.rois_exists?'<span class="mut">· net_rois.json ✓</span>':'<span class="mut">· ROI 미설정</span>'}</div>
      ${g.length?`<table><tr><th>경기</th><th>cam1</th><th>cam2</th><th>겹침</th></tr>
        ${g.map(x=>`<tr><td>${x.game}</td><td>${x.cam1.split('/').pop()}</td><td>${x.cam2.split('/').pop()}</td><td>${mmss(x.overlap)}</td></tr>`).join('')}</table>`
        :'<div class="mut">경기 없음 — 루트를 확인하세요.</div>'}
    </div>`;
  $('#setRoot').onclick=async()=>{ try{ STATE=await api('/api/root',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('#rootIn').value})}); $('#root').textContent='📁 '+STATE.root; renderSetup(); }catch(e){alert(e.message);} };
}

/* ---------- ② CALIBRATION ---------- */
let calImg=null, calBox=null, calDrag=null, rois={};
async function renderCal(){
  rois=await api('/api/rois').catch(()=>({}));
  const cams=[...new Set(STATE.games.flatMap(g=>[g.cam1,g.cam2]))];
  const keyGuess=p=>{const n=p.split('/').pop(); return (n.match(/^[A-Za-z]+/)||['cam'])[0];};
  $('#cal').innerHTML=`
    <div class="card">
      <div class="row"><b>골망 ROI 캘리브레이션</b> <span class="mut">카메라에 <b>가까운 골망 하나만</b> 드래그로 박스. 캠을 바꾸면 그 캠 프레임·저장된 박스가 바로 뜹니다. 각 캠 1개씩.</span></div>
      <div class="row">
        <select id="calCam"></select>
        <label class="mut">시각(초) <input id="calT" type="number" value="60" step="5"></label>
        <button class="btn" id="calGrab">프레임 새로고침</button>
        <label class="mut">키 <input id="calKey" style="width:80px"></label>
        <span id="calStat" class="mut"></span>
        <button class="btn primary" id="calSave" style="margin-left:auto">net_rois.json 저장</button>
      </div>
      <canvas id="calCv" width="720" height="405"></canvas>
      <div class="mut" style="margin:6px 0 0">골망을 드래그하면 <b>자동 저장</b>됩니다. 다시 그리면 갱신, 아래 표에서 삭제.</div>
      <table id="calTbl"></table>
    </div>`;
  const cv=$('#calCv'),ctx=cv.getContext('2d');
  const curKey=()=>$('#calKey').value.trim();
  const calMsg=(txt,color)=>{ctx.fillStyle='#0e1116';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=color;ctx.font='14px sans-serif';ctx.fillText(txt,20,cv.height/2);};
  const fillCams=()=>{$('#calCam').innerHTML=cams.map(c=>{const done=rois[keyGuess(c)]?' ✓':'';return `<option value="${c}">${c.split('/').pop()}${done}</option>`;}).join('');};
  const restoreBox=()=>{const v=rois[curKey()];calBox=v?{x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height}:null;};
  const updStat=()=>{$('#calStat').textContent=rois[curKey()]?'✓ 이 캠 저장됨':'미설정 — 골망을 드래그';};
  window.drawCal=()=>{ctx.clearRect(0,0,cv.width,cv.height);
    if(calImg)ctx.drawImage(calImg,0,0,cv.width,cv.height);
    if(calBox){ctx.strokeStyle='#37d67a';ctx.lineWidth=2;ctx.strokeRect(calBox.x,calBox.y,calBox.w,calBox.h);ctx.fillStyle='rgba(55,214,122,.15)';ctx.fillRect(calBox.x,calBox.y,calBox.w,calBox.h);}};
  let calReq=0, calShownKey=null;   // token to discard stale loads + key of the frame ACTUALLY shown
  const grab=()=>{
    const myReq=++calReq;
    const cam=$('#calCam').value, key=curKey(), t=$('#calT').value;   // capture key at request time
    calImg=null; calBox=null; calShownKey=null;
    calMsg('프레임 불러오는 중… (원본이 커서 몇 초 걸릴 수 있어요)','#8b95a3');
    const im=new Image();
    im.onload=()=>{ if(myReq!==calReq) return;   // a newer switch happened -> ignore this stale frame
      calImg=im; calShownKey=key;
      const w=Math.min(720,im.naturalWidth); cv.width=w; cv.height=Math.round(im.naturalHeight*w/im.naturalWidth);
      const v=rois[key]; calBox=v?{x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height}:null;  // restore THIS key's box
      drawCal(); updStat();
    };
    im.onerror=()=>{ if(myReq!==calReq) return; calImg=null; calMsg('프레임 로드 실패 — 서버가 켜져 있는지 확인하세요 (gui/server.py)','#ff6b6b'); };
    im.src=`/api/frame?path=${encodeURIComponent(cam)}&t=${t}`;
  };
  fillCams();
  $('#calKey').value=keyGuess($('#calCam').value);
  $('#calCam').onchange=()=>{$('#calKey').value=keyGuess($('#calCam').value);grab();};
  $('#calKey').oninput=()=>{if(calImg)calShownKey=curKey();restoreBox();drawCal();updStat();};
  $('#calGrab').onclick=grab;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.onmousedown=e=>{if(calImg){const p=pos(e);calDrag={x0:p.x,y0:p.y};}};
  cv.onmousemove=e=>{if(!calDrag)return;const p=pos(e);calBox={x:Math.min(calDrag.x0,p.x),y:Math.min(calDrag.y0,p.y),w:Math.abs(p.x-calDrag.x0),h:Math.abs(p.y-calDrag.y0)};drawCal();};
  window.onmouseup=()=>{
    // save to the key of the frame ACTUALLY on screen, never a stale #calKey
    if(calDrag&&calBox&&calBox.w>6&&calBox.h>6&&calShownKey){
      rois[calShownKey]=[round(calBox.x/cv.width,4),round(calBox.y/cv.height,4),round(calBox.w/cv.width,4),round(calBox.h/cv.height,4)];
      calTbl();fillCams();updStat();}
    calDrag=null;
  };
  window.calTbl=()=>{const t=$('#calTbl');
    const rows=Object.entries(rois).map(([k,v])=>`<tr${k===curKey()?' style="background:#232b34"':''}><td><b>${k}</b></td>${v.map(n=>`<td>${n}</td>`).join('')}<td><button class="btn sm" data-del="${k}">삭제</button></td></tr>`).join('');
    t.innerHTML='<tr><th>키</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="mut">아직 없음 — 캠 선택 후 골망을 드래그하세요</td></tr>');
    t.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del;delete rois[k];if(k===curKey())calBox=null;calTbl();fillCams();drawCal();updStat();});};
  $('#calSave').onclick=async()=>{
    try{await api('/api/rois',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rois})});$('#calStat').textContent='✓ net_rois.json 저장 완료';STATE.rois_exists=true;}
    catch(e){$('#calStat').textContent='저장 실패: '+e.message;}};
  calTbl(); updStat(); grab();   // auto-load first cam frame + its saved ROI
}

/* ---------- ③ EDIT — timeline editor ---------- */
let plan=null, clips=[];
const camName=p=>{const n=(p||'').split('/').pop();return (n.match(/^[A-Za-z0-9]+/)||['cam'])[0];};
function segLen(c){const xf=plan.crossfade_sec||0;const s=c.data.segments.reduce((a,g)=>a+(g.src_out-g.src_in),0);return Math.max(0,s-xf*(c.data.segments.length-1));}
function updStats(){const inc=clips.filter(c=>c.include);
  $('#edStat').textContent=`후보 ${clips.length} · 포함 ${inc.length} · 합본 ~${mmss(inc.reduce((a,c)=>a+segLen(c),0))}`;}

async function renderEdit(){
  $('#edit').innerHTML=`<div class="card"><div class="row">
    <b>경기</b><select id="edGame">${STATE.games.map(g=>`<option value="${g.game}">경기 ${g.game}</option>`).join('')}</select>
    <button class="btn" id="edLoad">골 후보 불러오기</button>
    <button class="btn" id="edFresh" title="오디오·넷ROI 다시 분석 (캘리브레이션 바꿨으면 이걸로)">다시 감지</button>
    <span id="edStat" class="mut"></span></div>
    <div class="mut">카드 클릭 후 — <b>Space</b> 구간 재생 · <b>I</b> 인 · <b>O</b> 아웃 · <b>C</b> 컷(앵글 전환)을 재생 위치로. 타임라인의 핸들을 드래그해 다듬으세요.</div>
  </div><div id="edList"></div>`;
  const load=async fresh=>{
    $('#edStat').textContent=fresh?'다시 분석 중… (오디오+넷ROI, 수십 초)':'후보 불러오는 중…';
    try{plan=await api('/api/plan?game='+$('#edGame').value+(fresh?'&fresh=1':''));
      clips=plan.clips.map(d=>({data:d,include:true}));
      drawEdit();
      if(plan.cached)$('#edStat').textContent+=' · 캐시됨(재분석은 "다시 감지")';}
    catch(e){$('#edStat').textContent='오류: '+e.message;}
  };
  $('#edLoad').onclick=()=>load(false);
  $('#edFresh').onclick=()=>load(true);
  if(plan){$('#edGame').value=plan.game;drawEdit();}
}

function buildCard(c,i){
  const d=c.data,segs=d.segments,two=segs.length>1;
  const el=document.createElement('div');el.className='card clip'+(c.include?'':' excluded');el.tabIndex=0;
  el.innerHTML=`
    <div class="row"><b>골 <span class="t">${mmss(d.T)}</span></b>
      <span class="mut">${two?`${camName(segs[0].cam)} → ${camName(segs[1].cam)}`:camName(segs[0].cam)}${d.goal_cam?` · 골쪽 ${camName(d.goal_cam)}`:''} · ~<span data-len>${round(segLen(c),1)}</span>s</span>
      <label style="margin-left:auto"><input type="checkbox" ${c.include?'checked':''} data-inc> 포함</label>
      <button class="btn sm" data-up ${i===0?'disabled':''}>▲</button>
      <button class="btn sm" data-down ${i===clips.length-1?'disabled':''}>▼</button></div>
    <video data-vid preload="metadata"></video>
    <div class="tl" data-tl>
      <canvas class="wave" data-wave></canvas>
      <div class="blk b0" data-b0>${camName(segs[0].cam)}</div>
      <div class="blk b1" data-b1>${two?camName(segs[1].cam):''}</div>
      <div class="ph" data-ph></div>
      <div class="hd hin" data-hd="in" title="인점 드래그"></div>
      <div class="hd hcut" data-hd="cut" title="컷(앵글 전환) 드래그"></div>
      <div class="hd hout" data-hd="out" title="아웃점 드래그"></div>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn sm" data-play>⏯ 구간 재생</button>
      <span class="mut" data-time>0.0 / 0.0s</span>
      <span class="mut" style="margin-left:auto">
        in <input type="number" step="0.1" data-n="in" style="width:76px">
        ${two?'컷 <input type="number" step="0.1" data-n="cut" style="width:76px">':''}
        out <input type="number" step="0.1" data-n="out" style="width:76px"></span>
    </div>`;
  const q=s=>el.querySelector(s), vid=q('[data-vid]'), tl=q('[data-tl]');
  // unified track coordinate u: seg0 source time; seg1 mapped via shift frozen at build,
  // so handles/playhead stay put while values change. Domain (view window) also frozen.
  const shift=two?(segs[1].src_in-segs[0].src_out):0;
  const PAD=6;
  const U0=Math.max(0,segs[0].src_in-PAD);
  const U1=(two?segs[1].src_out-shift:segs[0].src_out)+PAD;
  const X=u=>(u-U0)/(U1-U0)*tl.clientWidth;
  const UofX=x=>U0+x/tl.clientWidth*(U1-U0);
  const uIn=()=>segs[0].src_in, uCut=()=>segs[0].src_out, uOut=()=>two?segs[1].src_out-shift:segs[0].src_out;
  let curSeg=0, playing=false;
  function layout(){
    const b0=q('[data-b0]'),b1=q('[data-b1]');
    b0.style.left=X(uIn())+'px';b0.style.width=Math.max(0,X(uCut())-X(uIn()))+'px';
    if(two){b1.style.display='';b1.style.left=X(uCut())+'px';b1.style.width=Math.max(0,X(uOut())-X(uCut()))+'px';}
    else b1.style.display='none';
    q('.hin').style.left=X(uIn())+'px';
    q('.hcut').style.display=two?'':'none';if(two)q('.hcut').style.left=X(uCut())+'px';
    q('.hout').style.left=X(uOut())+'px';
    q('[data-n="in"]').value=round(uIn(),2);
    const ci=q('[data-n="cut"]');if(ci)ci.value=round(uCut(),2);
    q('[data-n="out"]').value=round(two?segs[1].src_out:segs[0].src_out,2);
    q('[data-len]').textContent=round(segLen(c),1);
  }
  const srcOf=s=>'/media/'+encodeURIComponent(segs[s].src_rel);
  function setSeg(s,t,thenPlay){
    curSeg=s;
    const apply=()=>{vid.currentTime=Math.max(0,t);if(thenPlay)vid.play();};
    if(vid.dataset.seg!==String(s)){vid.dataset.seg=String(s);vid.src=srcOf(s);vid.onloadedmetadata=apply;}
    else apply();
  }
  const uNow=()=>curSeg===0?vid.currentTime:vid.currentTime-shift;
  function seekU(u,thenPlay){
    u=Math.max(U0,Math.min(U1,u));
    if(!two||u<uCut())setSeg(0,u,thenPlay);else setSeg(1,u+shift,thenPlay);
  }
  vid.addEventListener('timeupdate',()=>{
    const u=uNow();
    q('[data-ph]').style.left=X(Math.max(U0,Math.min(U1,u)))+'px';
    q('[data-time]').textContent=`${round(Math.max(0,u-uIn()),1)} / ${round(uOut()-uIn(),1)}s`;
    if(playing){
      if(curSeg===0&&two&&vid.currentTime>=uCut()-0.03)setSeg(1,segs[1].src_in,true);
      else if((curSeg===(two?1:0))&&vid.currentTime>=(two?segs[1].src_out:segs[0].src_out)){vid.pause();playing=false;}
    }
  });
  q('[data-play]').onclick=()=>{
    if(playing){vid.pause();playing=false;return;}
    playing=true;
    const u=uNow();
    if(u<=uIn()+0.05||u>=uOut()-0.05)seekU(uIn(),true);
    else if(vid.paused)vid.play();
  };
  // timeline: click/drag = seek, handles = trim (cut moves both sides in lockstep)
  let drag=null;
  tl.addEventListener('pointerdown',e=>{
    const hd=e.target.dataset?e.target.dataset.hd:null;
    tl.setPointerCapture(e.pointerId);
    if(hd)drag={hd};
    else{drag={hd:null};seekU(UofX(e.clientX-tl.getBoundingClientRect().left),false);}
  });
  tl.addEventListener('pointermove',e=>{
    if(!drag)return;
    const u=UofX(e.clientX-tl.getBoundingClientRect().left);
    if(!drag.hd){seekU(u,false);return;}
    if(drag.hd==='in')segs[0].src_in=Math.max(0,Math.min(uCut()-0.5,u));
    else if(drag.hd==='out'){if(two)segs[1].src_out=Math.max(segs[1].src_in+0.5,u+shift);else segs[0].src_out=Math.max(segs[0].src_in+0.5,u);}
    else if(drag.hd==='cut'&&two){
      const nu=Math.max(uIn()+0.5,Math.min(uOut()-0.5,u));
      const dt=nu-segs[0].src_out;
      segs[0].src_out=nu;segs[1].src_in=Math.max(0,segs[1].src_in+dt);   // keep real-time alignment
    }
    layout();
  });
  const endDrag=()=>{if(drag&&drag.hd)updStats();drag=null;};
  tl.addEventListener('pointerup',endDrag);tl.addEventListener('pointercancel',endDrag);
  // number inputs (advanced): cut keeps alignment like the handle
  q('[data-n="in"]').onchange=e=>{segs[0].src_in=Math.max(0,Math.min(uCut()-0.5,parseFloat(e.target.value)||0));layout();updStats();};
  const ci=q('[data-n="cut"]');
  if(ci)ci.onchange=e=>{const v=parseFloat(e.target.value)||0;const dt=v-segs[0].src_out;segs[0].src_out=v;segs[1].src_in=Math.max(0,segs[1].src_in+dt);layout();updStats();};
  q('[data-n="out"]').onchange=e=>{const v=parseFloat(e.target.value)||0;if(two)segs[1].src_out=v;else segs[0].src_out=v;layout();updStats();};
  // card interactions
  q('[data-inc]').onchange=e=>{c.include=e.target.checked;el.classList.toggle('excluded',!c.include);updStats();};
  q('[data-up]').onclick=()=>{[clips[i-1],clips[i]]=[clips[i],clips[i-1]];drawEdit();};
  q('[data-down]').onclick=()=>{[clips[i+1],clips[i]]=[clips[i],clips[i+1]];drawEdit();};
  el.addEventListener('pointerdown',()=>el.focus());
  el.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.key===' '){e.preventDefault();q('[data-play]').click();}
    else if(e.key==='i'||e.key==='I'){segs[0].src_in=Math.max(0,Math.min(uCut()-0.5,uNow()));layout();updStats();}
    else if(e.key==='o'||e.key==='O'){if(two)segs[1].src_out=Math.max(segs[1].src_in+0.5,uNow()+shift);else segs[0].src_out=Math.max(segs[0].src_in+0.5,uNow());layout();updStats();}
    else if((e.key==='c'||e.key==='C')&&two){const nu=Math.max(uIn()+0.5,Math.min(uOut()-0.5,uNow()));const dt=nu-segs[0].src_out;segs[0].src_out=nu;segs[1].src_in=Math.max(0,segs[1].src_in+dt);layout();updStats();}
  });
  async function drawWave(){
    // cheer envelope behind the blocks — cut while SEEING the roar
    const rel=plan.audio_rel&&plan.audio_rel[segs[0].cam];
    if(!rel)return;
    try{
      const cnv=q('[data-wave]'),w=tl.clientWidth,h=tl.clientHeight;
      cnv.width=w;cnv.height=h;
      const r=await api(`/api/wave?path=${encodeURIComponent(rel)}&t0=${round(U0,2)}&t1=${round(U1,2)}&n=${Math.min(600,Math.max(120,Math.round(w/2)))}`);
      const g=cnv.getContext('2d');g.clearRect(0,0,w,h);g.fillStyle='rgba(160,172,188,.55)';
      const n=r.peaks.length,bw=w/n,mid=h/2;
      r.peaks.forEach((p,i)=>{const bh=Math.max(1,p*(h-8));g.fillRect(i*bw,mid-bh/2,Math.max(1,bw-0.5),bh);});
    }catch(e){}
  }
  requestAnimationFrame(()=>{layout();setSeg(0,uIn(),false);drawWave();});  // layout after insert (needs clientWidth)
  return el;
}

function drawEdit(){
  updStats();
  const list=$('#edList');list.innerHTML='';
  clips.forEach((c,i)=>list.appendChild(buildCard(c,i)));
  const foot=document.createElement('div');foot.className='card';
  foot.innerHTML=`<div class="row">
    <button class="btn primary" id="edRender">포함 클립 렌더</button>
    <label class="mut">출력 <input id="edOut" value="${window._edOut||'data/output/gui'}" style="width:150px"></label>
    <label class="mut">BGM <input id="edBgm" placeholder="data/bgm.mp3 (선택)" value="${window._edBgm||''}" style="width:160px"></label>
    <label class="mut">음량 <input id="edVol" type="range" min="0" max="0.5" step="0.05" value="${window._edVol||0.15}"></label>
  </div>
  <div class="prog" id="edProgWrap" hidden><i id="edProg"></i></div>
  <div id="edRstat" class="mut" style="margin-top:6px"></div>`;
  list.appendChild(foot);
  $('#edRender').onclick=startRender;
}

async function startRender(){
  window._edOut=$('#edOut').value;window._edBgm=$('#edBgm').value;window._edVol=$('#edVol').value;
  const out={...plan,clips:clips.filter(c=>c.include).map(c=>c.data)};
  if(!out.clips.length){$('#edRstat').textContent='포함된 클립이 없습니다';return;}
  $('#edProgWrap').hidden=false;$('#edProg').style.width='0%';$('#edRstat').textContent='렌더 시작…';
  try{
    const r=await api('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({plan:out,out:window._edOut,bgm:window._edBgm||null,bgm_volume:parseFloat(window._edVol)})});
    const poll=async()=>{
      try{
        const s=await api('/api/render_status?job='+r.job);
        if(s.status==='running'){const[i,n]=s.progress||[0,1];
          $('#edProg').style.width=Math.round(i/Math.max(1,n)*100)+'%';
          $('#edRstat').textContent=i>=n?`합본·BGM 처리 중… (${n}클립 완료)`:`렌더 중… ${i}/${n} 클립`;
          setTimeout(poll,1000);}
        else if(s.status==='done'){$('#edProg').style.width='100%';
          $('#edRstat').innerHTML=`✓ 완료: ${s.clips.length}클립 + highlight_all.mp4 → <code>${window._edOut}</code>`;}
        else $('#edRstat').textContent='렌더 오류: '+(s.error||'unknown');
      }catch(e){$('#edRstat').textContent='상태 조회 실패: '+e.message;}
    };
    poll();
  }catch(e){$('#edRstat').textContent='오류: '+e.message;}
}
loadState();
</script>

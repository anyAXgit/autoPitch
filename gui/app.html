<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoPitch 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1216;--panel:#191f27;--line:#2a323d;--fg:#e7ebf0;--mut:#8b95a3;--accent:#4ea1ff;--ok:#37d67a;--drop:#ff6b6b;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 'Noto Sans KR',-apple-system,Segoe UI,Roboto,sans-serif;}
  button,input,select{font-family:inherit;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;}
  header h1{font-size:15px;margin:0 14px 0 0;}
  .tab{background:none;border:none;color:var(--mut);padding:8px 12px;cursor:pointer;border-radius:7px;font-size:13px;}
  .tab.on{background:#232b34;color:var(--fg);}
  #root{margin-left:auto;color:var(--mut);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{max-width:1000px;margin:0 auto;padding:16px;}
  .btn{background:#232a33;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--accent);} .btn.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:600;}
  .btn.sm{padding:3px 7px;font-size:12px;} .btn:disabled{opacity:.4;cursor:default;}
  input,select{background:#0e1116;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;}
  input[type=number]{width:80px;font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .mut{color:var(--mut);} .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;}
  canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;background:#000;display:block;}
  video{width:100%;max-height:300px;background:#000;border-radius:8px;}
  .tl{position:relative;height:40px;background:#0b0e12;border:1px solid var(--line);border-radius:6px;margin-top:8px;touch-action:none;cursor:pointer;}
  .tl .blk{position:absolute;top:6px;bottom:6px;border-radius:4px;font-size:10px;line-height:1;color:#e8eef5;overflow:hidden;padding:3px 5px;pointer-events:none;white-space:nowrap;}
  .tl .b0{background:rgba(47,93,138,.55);} .tl .b1{background:rgba(138,90,47,.55);}
  .tl .wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:none;background:transparent;border-radius:6px;}
  .tl .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;}
  .tl .hd{position:absolute;top:-4px;bottom:-4px;width:10px;margin-left:-5px;cursor:ew-resize;border-radius:3px;background:var(--accent);}
  .tl .hd.hcut{background:var(--ok);}
  .prog{height:8px;background:#0e1116;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
  .clip:focus{outline:1px solid var(--accent);}
  /* ---- NLE editor (webcut-style) ---- */
  main.wide{max-width:none;padding:0;}
  .nle{display:grid;grid-template-rows:auto minmax(0,1fr) 218px;grid-template-columns:minmax(0,1fr);height:calc(100vh - 47px);}
  .nle>*{min-width:0;}
  .nle-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;}
  .nle-top{display:grid;grid-template-columns:236px minmax(0,1fr) 268px;min-height:0;}
  .npane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .npane:last-child{border-right:none;}
  .npane .hd{padding:7px 10px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);background:var(--panel);}
  .npane .bd{overflow-y:auto;flex:1;min-height:0;padding:8px;}
  .lib-item{padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12px;display:flex;gap:6px;align-items:center;}
  .lib-item.sel{border-color:var(--accent);background:#182230;}
  .lib-item.off{opacity:.45;}
  .lib-item .t{font-weight:600;}
  .lib-item .mut{margin-left:auto;}
  .viewer{display:flex;flex-direction:column;min-height:0;}
  .viewer video{flex:1;min-height:0;width:100%;max-height:none;object-fit:contain;background:#000;border-radius:0;}
  .transport{display:flex;gap:6px;align-items:center;justify-content:center;padding:7px;background:var(--panel);border-top:1px solid var(--line);}
  .transport .time{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;min-width:120px;text-align:center;}
  .insp .sec{border-bottom:1px solid var(--line);padding:9px 10px;}
  .insp .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .insp .kv{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;flex-wrap:wrap;}
  .insp input[type=number]{width:74px;padding:4px 6px;}
  .insp .btn{width:100%;margin-top:5px;text-align:center;}
  .insp .btn.half{width:calc(50% - 3px);display:inline-block;}
  /* timeline */
  .ntl{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);background:#0d1014;}
  .ntl-bar{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);}
  .ntl-bar input[type=range]{width:110px;}
  .ntl-scroll{overflow-x:auto;overflow-y:hidden;flex:1;position:relative;min-width:0;}
  .ntl-inner{position:relative;height:100%;min-width:100%;}
  .nruler{position:relative;height:22px;border-bottom:1px solid var(--line);cursor:pointer;}
  .nruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2b323d;color:#64707f;font-size:10px;padding:3px 0 0 4px;user-select:none;}
  .nlane{position:relative;height:96px;margin-top:14px;}
  .nclip{position:absolute;top:0;height:96px;background:#141a22;border:1px solid #2b3644;border-radius:7px;overflow:hidden;cursor:grab;}
  .nclip.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .nclip .nwave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:none;background:transparent;}
  .nclip .nseg{position:absolute;top:0;bottom:0;pointer-events:none;}
  .nclip .nseg.s0{background:rgba(47,93,138,.35);}
  .nclip .nseg.s1{background:rgba(138,90,47,.35);}
  .nclip .nlabel{position:absolute;left:6px;top:4px;font-size:11px;color:#dfe7f0;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;}
  .nclip .ncams{position:absolute;left:6px;bottom:4px;font-size:10px;color:#9fb0c2;text-shadow:0 1px 2px #000;pointer-events:none;}
  .nclip .trim{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(78,161,255,.25);}
  .nclip .trim.l{left:0;border-radius:7px 0 0 7px;} .nclip .trim.r{right:0;border-radius:0 7px 7px 0;}
  .nclip .trim:hover{background:rgba(78,161,255,.6);}
  .nclip .ncut{position:absolute;top:0;bottom:0;width:9px;margin-left:-4.5px;cursor:ew-resize;background:rgba(55,214,122,.45);}
  .nclip .ncut:hover{background:rgba(55,214,122,.8);}
  .nclip .ndel{position:absolute;right:11px;top:3px;background:none;border:none;color:#8b95a3;cursor:pointer;font-size:12px;}
  .nclip .ndel:hover{color:var(--drop);}
  .nph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:5;}
  .nph .head{position:absolute;top:0;left:-5px;width:12px;height:12px;background:#fff;border-radius:0 0 6px 6px;pointer-events:auto;cursor:ew-resize;}
  .nskim{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);pointer-events:none;z-index:4;display:none;}
  .ntl-empty{color:var(--mut);font-size:12px;padding:30px 16px;}
  .tbtn{background:#232a33;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;}
  .tbtn.on{border-color:var(--accent);color:var(--accent);}
  .tbtn:disabled{opacity:.4;}
  code{background:#0e1116;padding:1px 5px;border-radius:4px;border:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;margin-top:8px;} td,th{border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left;}
  .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin:3px 0;}
  .clip.excluded{opacity:.45;}
  .t{color:var(--accent);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<header>
  <h1>🎬 autoPitch 스튜디오</h1>
  <button class="tab on" data-tab="setup">① 설정</button>
  <button class="tab" data-tab="cal">② 골 ROI</button>
  <button class="tab" data-tab="edit">③ 편집·렌더</button>
  <span id="root">–</span>
</header>
<main>
  <section id="setup"></section>
  <section id="cal" hidden></section>
  <section id="edit" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(p,o)=>{const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;};
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const round=(n,d=2)=>Math.round(n*10**d)/10**d;
let STATE={root:'',games:[],rois_exists:false};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['setup','cal','edit'].forEach(id=>$('#'+id).hidden = id!==b.dataset.tab);
  document.querySelector('main').classList.toggle('wide', b.dataset.tab==='edit');
  if(b.dataset.tab==='cal') renderCal();
  if(b.dataset.tab==='edit') renderEdit();
});

async function loadState(){ STATE=await api('/api/state'); $('#root').textContent='📁 '+STATE.root; renderSetup(); }

/* ---------- ① SETUP ---------- */
function renderSetup(){
  const g=STATE.games;
  $('#setup').innerHTML=`
    <div class="card">
      <div class="row"><b>프로젝트 루트</b></div>
      <div class="row"><input id="rootIn" style="flex:1" value="${STATE.root}">
        <button class="btn" id="setRoot">설정</button></div>
      <div class="mut">루트에 <code>data/raw/cam1</code>, <code>data/raw/cam2</code>, <code>config.yaml</code>이 있어야 합니다.</div>
    </div>
    <div class="card">
      <div class="row"><b>감지된 경기</b> <span class="mut">(촬영시각 페어링)</span> ${STATE.rois_exists?'<span class="mut">· net_rois.json ✓</span>':'<span class="mut">· ROI 미설정</span>'}</div>
      ${g.length?`<table><tr><th>경기</th><th>cam1</th><th>cam2</th><th>겹침</th></tr>
        ${g.map(x=>`<tr><td>${x.game}</td><td>${x.cam1.split('/').pop()}</td><td>${x.cam2.split('/').pop()}</td><td>${mmss(x.overlap)}</td></tr>`).join('')}</table>`
        :'<div class="mut">경기 없음 — 루트를 확인하세요.</div>'}
    </div>`;
  $('#setRoot').onclick=async()=>{ try{ STATE=await api('/api/root',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('#rootIn').value})}); $('#root').textContent='📁 '+STATE.root; renderSetup(); }catch(e){alert(e.message);} };
}

/* ---------- ② CALIBRATION ---------- */
let calImg=null, calBox=null, calDrag=null, rois={};
async function renderCal(){
  rois=await api('/api/rois').catch(()=>({}));
  const cams=[...new Set(STATE.games.flatMap(g=>[g.cam1,g.cam2]))];
  const keyGuess=p=>{const n=p.split('/').pop(); return (n.match(/^[A-Za-z]+/)||['cam'])[0];};
  $('#cal').innerHTML=`
    <div class="card">
      <div class="row"><b>골망 ROI 캘리브레이션</b> <span class="mut">카메라에 <b>가까운 골망 하나만</b> 드래그로 박스. 캠을 바꾸면 그 캠 프레임·저장된 박스가 바로 뜹니다. 각 캠 1개씩.</span></div>
      <div class="row">
        <select id="calCam"></select>
        <label class="mut">시각(초) <input id="calT" type="number" value="60" step="5"></label>
        <button class="btn" id="calGrab">프레임 새로고침</button>
        <label class="mut">키 <input id="calKey" style="width:80px"></label>
        <span id="calStat" class="mut"></span>
        <button class="btn primary" id="calSave" style="margin-left:auto">net_rois.json 저장</button>
      </div>
      <canvas id="calCv" width="720" height="405"></canvas>
      <div class="mut" style="margin:6px 0 0">골망을 드래그하면 <b>자동 저장</b>됩니다. 다시 그리면 갱신, 아래 표에서 삭제.</div>
      <table id="calTbl"></table>
    </div>`;
  const cv=$('#calCv'),ctx=cv.getContext('2d');
  const curKey=()=>$('#calKey').value.trim();
  const calMsg=(txt,color)=>{ctx.fillStyle='#0e1116';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=color;ctx.font='14px sans-serif';ctx.fillText(txt,20,cv.height/2);};
  const fillCams=()=>{$('#calCam').innerHTML=cams.map(c=>{const done=rois[keyGuess(c)]?' ✓':'';return `<option value="${c}">${c.split('/').pop()}${done}</option>`;}).join('');};
  const restoreBox=()=>{const v=rois[curKey()];calBox=v?{x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height}:null;};
  const updStat=()=>{$('#calStat').textContent=rois[curKey()]?'✓ 이 캠 저장됨':'미설정 — 골망을 드래그';};
  window.drawCal=()=>{ctx.clearRect(0,0,cv.width,cv.height);
    if(calImg)ctx.drawImage(calImg,0,0,cv.width,cv.height);
    if(calBox){ctx.strokeStyle='#37d67a';ctx.lineWidth=2;ctx.strokeRect(calBox.x,calBox.y,calBox.w,calBox.h);ctx.fillStyle='rgba(55,214,122,.15)';ctx.fillRect(calBox.x,calBox.y,calBox.w,calBox.h);}};
  let calReq=0, calShownKey=null;   // token to discard stale loads + key of the frame ACTUALLY shown
  const grab=()=>{
    const myReq=++calReq;
    const cam=$('#calCam').value, key=curKey(), t=$('#calT').value;   // capture key at request time
    calImg=null; calBox=null; calShownKey=null;
    calMsg('프레임 불러오는 중… (원본이 커서 몇 초 걸릴 수 있어요)','#8b95a3');
    const im=new Image();
    im.onload=()=>{ if(myReq!==calReq) return;   // a newer switch happened -> ignore this stale frame
      calImg=im; calShownKey=key;
      const w=Math.min(720,im.naturalWidth); cv.width=w; cv.height=Math.round(im.naturalHeight*w/im.naturalWidth);
      const v=rois[key]; calBox=v?{x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height}:null;  // restore THIS key's box
      drawCal(); updStat();
    };
    im.onerror=()=>{ if(myReq!==calReq) return; calImg=null; calMsg('프레임 로드 실패 — 서버가 켜져 있는지 확인하세요 (gui/server.py)','#ff6b6b'); };
    im.src=`/api/frame?path=${encodeURIComponent(cam)}&t=${t}`;
  };
  fillCams();
  $('#calKey').value=keyGuess($('#calCam').value);
  $('#calCam').onchange=()=>{$('#calKey').value=keyGuess($('#calCam').value);grab();};
  $('#calKey').oninput=()=>{if(calImg)calShownKey=curKey();restoreBox();drawCal();updStat();};
  $('#calGrab').onclick=grab;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.onmousedown=e=>{if(calImg){const p=pos(e);calDrag={x0:p.x,y0:p.y};}};
  cv.onmousemove=e=>{if(!calDrag)return;const p=pos(e);calBox={x:Math.min(calDrag.x0,p.x),y:Math.min(calDrag.y0,p.y),w:Math.abs(p.x-calDrag.x0),h:Math.abs(p.y-calDrag.y0)};drawCal();};
  window.onmouseup=()=>{
    // save to the key of the frame ACTUALLY on screen, never a stale #calKey
    if(calDrag&&calBox&&calBox.w>6&&calBox.h>6&&calShownKey){
      rois[calShownKey]=[round(calBox.x/cv.width,4),round(calBox.y/cv.height,4),round(calBox.w/cv.width,4),round(calBox.h/cv.height,4)];
      calTbl();fillCams();updStat();}
    calDrag=null;
  };
  window.calTbl=()=>{const t=$('#calTbl');
    const rows=Object.entries(rois).map(([k,v])=>`<tr${k===curKey()?' style="background:#232b34"':''}><td><b>${k}</b></td>${v.map(n=>`<td>${n}</td>`).join('')}<td><button class="btn sm" data-del="${k}">삭제</button></td></tr>`).join('');
    t.innerHTML='<tr><th>키</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="mut">아직 없음 — 캠 선택 후 골망을 드래그하세요</td></tr>');
    t.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del;delete rois[k];if(k===curKey())calBox=null;calTbl();fillCams();drawCal();updStat();});};
  $('#calSave').onclick=async()=>{
    try{await api('/api/rois',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rois})});$('#calStat').textContent='✓ net_rois.json 저장 완료';STATE.rois_exists=true;}
    catch(e){$('#calStat').textContent='저장 실패: '+e.message;}};
  calTbl(); updStat(); grab();   // auto-load first cam frame + its saved ROI
}

/* ---------- ③ EDIT — NLE editor (webcut-style: library / viewer / inspector / sequence timeline) ---------- */
let plan=null, clips=[], selId=null, nextId=1;
let PXPS=9, snapOn=true, autoFit=true;
let playN=0, playing=false, curIdx=0, curSeg=0, rafId=null, lastTs=0, switching=false;
let hist=[], future=[];
const camName=p=>{const n=(p||'').split('/').pop();return (n.match(/^[A-Za-z0-9]+/)||['cam'])[0];};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- sequence model: included clips in order; u inside clip = seg0 span then seg1 span ---- */
const segDur=g=>g.src_out-g.src_in;
const clipDur=c=>c.data.segments.reduce((a,g)=>a+segDur(g),0);
const seqClips=()=>clips.filter(c=>c.include);
const seqDur=()=>seqClips().reduce((a,c)=>a+clipDur(c),0);
const offsetOf=i=>{let x=0;const sc=seqClips();for(let k=0;k<i;k++)x+=clipDur(sc[k]);return x;};
function locate(t){ // seq time -> {idx, seg, src, rel}
  const sc=seqClips(); let x=0;
  for(let i=0;i<sc.length;i++){
    const c=sc[i], d=clipDur(c);
    if(t<x+d||i===sc.length-1){
      const u=clamp(t-x,0,d), s=c.data.segments, d0=segDur(s[0]);
      if(u<d0||s.length===1)return{idx:i,seg:0,src:s[0].src_in+Math.min(u,d0),rel:s[0].src_rel,clip:c};
      return{idx:i,seg:1,src:s[1].src_in+(u-d0),rel:s[1].src_rel,clip:c};
    }
    x+=d;
  }
  return null;
}
function editPoints(){const pts=[0];let x=0;for(const c of seqClips()){const s=c.data.segments;if(s.length>1)pts.push(x+segDur(s[0]));x+=clipDur(c);pts.push(x);}return pts;}

/* ---- undo/redo ---- */
const snapState=()=>clips.map(c=>({id:c.id,include:c.include,data:JSON.parse(JSON.stringify(c.data))}));
function pushHist(){hist.push(snapState());if(hist.length>60)hist.shift();future=[];updUndo();}
function undo(){if(!hist.length)return;future.push(snapState());clips=hist.pop();fixSel();renderAll();}
function redo(){if(!future.length)return;hist.push(snapState());clips=future.pop();fixSel();renderAll();}
function updUndo(){const u=$('#nUndo'),r=$('#nRedo');if(u){u.disabled=!hist.length;r.disabled=!future.length;}}
function fixSel(){if(!clips.find(c=>c.id===selId))selId=clips.length?clips[0].id:null;}
const selClip=()=>clips.find(c=>c.id===selId);

/* ---- shell ---- */
async function renderEdit(){
  document.querySelector('main').classList.add('wide');
  $('#edit').innerHTML=`<div class="nle">
    <div class="nle-bar">
      <b style="font-size:13px">경기</b>
      <select id="edGame">${STATE.games.map(g=>`<option value="${g.game}">경기 ${g.game}</option>`).join('')}</select>

/* ---- viewer / playback (webcut-style rAF clock, video drives time) ---- */
const vid=()=>$('#nVid');
function setSrc(rel,t,thenPlay){
  const v=vid();switching=true;
  const apply=()=>{v.currentTime=Math.max(0,t);switching=false;if(thenPlay)v.play();};
  if(v.dataset.rel!==rel){v.dataset.rel=rel;v.src='/media/'+encodeURIComponent(rel);v.onloadedmetadata=apply;}
  else apply();
}
function seekSeq(t){
  stopPlay();playN=clamp(t,0,seqDur());
  const m=locate(playN);if(!m){updatePh();return;}
  curIdx=m.idx;curSeg=m.seg;setSrc(m.rel,m.src,false);updatePh();
}
function enter(idx,seg,thenPlay){
  const sc=seqClips();curIdx=idx;curSeg=seg;
  const g=sc[idx].data.segments[seg];
  setSrc(g.src_rel,g.src_in,thenPlay);
}
function playTick(ts){
  if(!playing)return;
  const dt=(ts-lastTs)/1000;lastTs=ts;
  const sc=seqClips();if(!sc.length)return stopPlay();
  const v=vid();
  if(!switching&&!v.seeking){   // a pending seek still reports the OLD time — don't cascade boundaries
    const c=sc[curIdx],segs=c.data.segments,cur=v.currentTime;
    if(cur>=segs[curSeg].src_out-0.03){
      if(curSeg===0&&segs.length>1)enter(curIdx,1,true);
      else if(curIdx+1<sc.length){enter(curIdx+1,0,true);playN=offsetOf(curIdx);}
      else{stopPlay();playN=seqDur();updatePh();return;}
    }else{
      playN+=dt;
      const u=curSeg===0?cur-segs[0].src_in:segDur(segs[0])+(cur-segs[1].src_in);
      const real=offsetOf(curIdx)+clamp(u,0,clipDur(c));
      if(Math.abs(real-playN)>0.15)playN=real;
      playN=Math.min(playN,offsetOf(curIdx)+clipDur(c));
    }
  }
  updatePh();rafId=requestAnimationFrame(playTick);
}
function startPlay(){
  if(!seqClips().length)return;
  if(playN>=seqDur()-0.05)seekSeq(0);
  const m=locate(playN);curIdx=m.idx;curSeg=m.seg;
  playing=true;lastTs=performance.now();$('#tpPlay').textContent='⏸';
  setSrc(m.rel,m.src,true);rafId=requestAnimationFrame(playTick);
}
function stopPlay(){playing=false;if(rafId)cancelAnimationFrame(rafId);rafId=null;const v=vid();if(v)v.pause();const b=$('#tpPlay');if(b)b.textContent='▶';}
function updatePh(){
  const x=playN*PXPS;$('#nPh').style.transform=`translateX(${x}px)`;
  $('#tpTime').textContent=`${fmtT(playN)} / ${fmtT(seqDur())}`;
  if(playing){const sc=$('#ntlScroll');
    if(x<sc.scrollLeft+40||x>sc.scrollLeft+sc.clientWidth-40)sc.scrollLeft=x-sc.clientWidth/2;}
}
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`;

/* ---- timeline render ---- */
function niceStep(){const t=[0.5,1,2,5,10,15,30,60,120,300];for(const s of t)if(s*PXPS>=70)return s;return 600;}
function renderTimeline(){
  const inner=$('#ntlInner'),ruler=$('#nRuler'),lane=$('#nLane');
  const total=seqDur();
  if(autoFit&&total>0){const w=$('#ntlScroll').clientWidth-30;PXPS=clamp(w/total,3,120);$('#zoom').value=Math.round(PXPS);}
  inner.style.width=Math.max($('#ntlScroll').clientWidth,total*PXPS+60)+'px';
  ruler.innerHTML='';
  const step=niceStep();
  for(let s=0,n=0;s<=Math.ceil(total)+step&&n<2000;s+=step,n++){
    const t=document.createElement('div');t.className='tick';t.style.left=(s*PXPS)+'px';
    t.textContent=fmtT(s).replace(/\.0$/,'');ruler.appendChild(t);
  }
  lane.innerHTML='';
  const sc=seqClips();
  if(!sc.length){lane.innerHTML='<div class="ntl-empty">포함된 하이라이트가 없습니다 — 라이브러리에서 포함시키세요.</div>';}
  let x=0;
  sc.forEach((c,i)=>{
    const d=clipDur(c),w=Math.max(16,d*PXPS-2),segs=c.data.segments,two=segs.length>1;
    const d0px=segDur(segs[0])/d*w;
    const el=document.createElement('div');
    el.className='nclip'+(c.id===selId?' selected':'');
    el.style.left=x+'px';el.style.width=w+'px';el.dataset.id=c.id;el.draggable=true;
    el.innerHTML=`<canvas class="nwave"></canvas>
      <div class="nseg s0" style="left:0;width:${d0px}px"></div>
      ${two?`<div class="nseg s1" style="left:${d0px}px;right:0"></div><div class="ncut" style="left:${d0px}px" title="앵글 전환 — 크로스페이드 ${plan.crossfade_sec>0?plan.crossfade_sec+'s':'없음(하드컷)'}"></div>`:''}
      <div class="nlabel">${mmss(c.data.T)} · ${round(d,1)}s${c.data.goal_cam?' · 🥅'+camName(c.data.goal_cam):''}</div>
      <div class="ncams">${two?camName(segs[0].cam)+' → '+camName(segs[1].cam):camName(segs[0].cam)}</div>
      <div class="trim l"></div><div class="trim r"></div>
      <button class="ndel" title="제외 (⌫)">✕</button>`;
    lane.appendChild(el);
    bindClip(el,c);
    ensureWave(c,el);
    x+=d*PXPS;
  });
  $('#nCnt').textContent=sc.length;$('#nTot').textContent=fmtT(total);
  playN=Math.min(playN,total);updatePh();
}
function renderAll(){renderTimeline();renderLib();renderInsp();updUndo();}

/* ---- clip interactions: select / trim / cut / reorder / exclude ---- */
let trimming=false;
function bindClip(el,c){
  const segs=c.data.segments,two=segs.length>1;
  el.addEventListener('mousedown',ev=>{
    if(ev.target.matches('.trim,.ncut,.ndel'))return;
    selId=c.id;renderAll();
  });
  el.querySelector('.ndel').onclick=ev=>{ev.stopPropagation();pushHist();c.include=false;fixSel();renderAll();};
  const drag=(handle,apply)=>{
    handle.addEventListener('mousedown',ev=>{
      ev.preventDefault();ev.stopPropagation();selId=c.id;
      pushHist();trimming=true;
      const x0=ev.clientX,o=JSON.parse(JSON.stringify(segs));
      const mv=e=>{apply((e.clientX-x0)/PXPS,o);renderTimeline();renderInsp();};
      const up=()=>{trimming=false;window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);renderAll();};
      window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    });
  };
  drag(el.querySelector('.trim.l'),(dt,o)=>{segs[0].src_in=clamp(o[0].src_in+dt,0,segs[0].src_out-0.5);});
  drag(el.querySelector('.trim.r'),(dt,o)=>{const g=segs[segs.length-1],og=o[o.length-1];g.src_out=Math.max(g.src_in+0.5,og.src_out+dt);});
  const cut=el.querySelector('.ncut');
  if(cut)drag(cut,(dt,o)=>{ // move the angle switch: both cams in lockstep
    const nv=clamp(o[0].src_out+dt,segs[0].src_in+0.5,o[0].src_out+(o[1].src_out-o[1].src_in)-0.5);
    const d=nv-o[0].src_out;segs[0].src_out=nv;segs[1].src_in=Math.max(0,o[1].src_in+d);
  });
  el.addEventListener('dragstart',()=>{selId=c.id;});
  el.addEventListener('dragover',ev=>ev.preventDefault());
  el.addEventListener('drop',ev=>{
    ev.preventDefault();
    const from=clips.findIndex(k=>k.id===selId),to=clips.findIndex(k=>k.id===c.id);
    if(from<0||to<0||from===to)return;
    pushHist();const[m]=clips.splice(from,1);clips.splice(to,0,m);renderAll();
  });
  el.addEventListener('dblclick',()=>{seekSeq(offsetOf(seqClips().indexOf(c)));startPlay();});
}

/* ---- waveform inside clip blocks ---- */
async function ensureWave(c,el){
  if(!plan||!plan.audio_rel)return;
  const segs=c.data.segments;
  const key=JSON.stringify(segs.map(g=>[g.cam,round(g.src_in,1),round(g.src_out,1)]));
  const cnv=el.querySelector('.nwave');
  const draw=()=>{
    if(!c._wave)return;
    const w=el.clientWidth,h=el.clientHeight;if(!w)return;
    cnv.width=w;cnv.height=h;
    const g=cnv.getContext('2d');g.clearRect(0,0,w,h);g.fillStyle='rgba(160,172,188,.5)';
    const total=clipDur(c);let x=0;
    segs.forEach((sg,si)=>{
      const pk=c._wave[si];if(!pk){x+=segDur(sg)/total*w;return;}
      const segW=segDur(sg)/total*w,bw=segW/pk.length,mid=h/2;
      pk.forEach((p,i)=>{const bh=Math.max(1,p*(h-14));g.fillRect(x+i*bw,mid-bh/2,Math.max(1,bw-0.4),bh);});
      x+=segW;
    });
  };
  if(c._wkey===key&&c._wave){draw();return;}
  if(trimming){draw();return;}   // don't refetch mid-drag; redraw stale cache
  try{
    const parts=[];
    for(const sg of segs){
      const rel=plan.audio_rel[sg.cam];
      if(!rel){parts.push(null);continue;}
      const n=clamp(Math.round(segDur(sg)*12),40,800);
      const r=await api(`/api/wave?path=${encodeURIComponent(rel)}&t0=${round(sg.src_in,2)}&t1=${round(sg.src_out,2)}&n=${n}`);
      parts.push(r.peaks);
    }
    c._wave=parts;c._wkey=key;draw();
  }catch(e){}
}

/* ---- library / inspector ---- */
function renderLib(){
  const lib=$('#nLib');lib.innerHTML='';
  $('#libN').textContent=`${clips.filter(c=>c.include).length}/${clips.length}`;
  clips.forEach(c=>{
    const d=c.data,el=document.createElement('div');
    el.className='lib-item'+(c.id===selId?' sel':'')+(c.include?'':' off');
    el.innerHTML=`<span class="t">${mmss(d.T)}</span>
      <span class="mut">${d.segments.length>1?camName(d.segments[0].cam)+'→'+camName(d.segments[1].cam):camName(d.segments[0].cam)} · ${round(clipDur(c),1)}s</span>
      <button class="tbtn" data-tog>${c.include?'제외':'포함'}</button>`;
    el.onclick=e=>{
      if(e.target.dataset&&'tog'in e.target.dataset){pushHist();c.include=!c.include;fixSel();renderAll();return;}
      selId=c.id;renderAll();
      if(c.include)seekSeq(offsetOf(seqClips().indexOf(c)));
    };
    lib.appendChild(el);
  });
}
/* ---- angle configuration: single-cam or either two-cam order ----
   All cams share one real-time axis via plan.offsets (camA-time = src - offset),
   so segments can be rebuilt for any cam order without losing the moment. */
function camMap(){
  const m={};
  clips.forEach(c=>c.data.segments.forEach(g=>{m[g.cam]={src:g.src,src_rel:g.src_rel};}));
  return m;
}
function currentOrder(c){return c.data.segments.map(g=>g.cam);}
function setAngles(c,order){
  const off=cam=>(plan.offsets&&plan.offsets[cam])||0;
  const m=camMap(),segs=c.data.segments;
  const t0=segs[0].src_in-off(segs[0].cam);
  const te=segs[segs.length-1].src_out-off(segs[segs.length-1].cam);
  // keep the existing switch point; when coming FROM single-cam, default to T+2s
  let tc=segs.length>1?segs[0].src_out-off(segs[0].cam):clamp(c.data.T+2,t0+0.5,te-0.5);
  tc=clamp(tc,t0+0.5,te-0.5);
  const mk=(cam,a,b)=>({cam,src:m[cam].src,src_rel:m[cam].src_rel,
                        src_in:Math.max(0,a+off(cam)),src_out:b+off(cam)});
  c.data.segments=order.length===1?[mk(order[0],t0,te)]:[mk(order[0],t0,tc),mk(order[1],tc,te)];
  c._wave=null;c._wkey=null;   // waveform must refetch for the new cams
}

function renderInsp(){
  const box=$('#nInsp'),c=selClip();
  if(!c){box.innerHTML='<div class="mut" style="padding:10px;font-size:12px">클립을 선택하세요</div>';return;}
  const segs=c.data.segments,two=segs.length>1;
  box.innerHTML=`
    <div class="sec"><div class="lbl">선택한 하이라이트</div>
      <div class="kv"><b>${mmss(c.data.T)}</b><span class="mut">peak ${round(c.data.peak,1)}${c.data.goal_cam?' · 골쪽 '+camName(c.data.goal_cam):''}</span></div>
      <div class="kv mut">${two?camName(segs[0].cam)+' → '+camName(segs[1].cam):camName(segs[0].cam)} · ${round(clipDur(c),1)}s</div>
    </div>
    <div class="sec"><div class="lbl">앵글 구성</div><div class="kv" id="angRow"></div>
      <div class="kv mut" style="font-size:11px">전환 시점은 타임라인의 초록 핸들로 조정</div></div>
    <div class="sec"><div class="lbl">컷 지점 (초 · 소스 타임)</div>
      <div class="kv">in <input type="number" step="0.1" data-n="in" value="${round(segs[0].src_in,2)}">
        <button class="tbtn" data-set="in" title="재생점을 인으로 (I)">=재생점</button></div>
      ${two?`<div class="kv">컷 <input type="number" step="0.1" data-n="cut" value="${round(segs[0].src_out,2)}">
        <button class="tbtn" data-set="cut" title="재생점을 컷으로 (C)">=재생점</button></div>`:''}
      <div class="kv">out <input type="number" step="0.1" data-n="out" value="${round(segs[segs.length-1].src_out,2)}">
        <button class="tbtn" data-set="out" title="재생점을 아웃으로 (O)">=재생점</button></div>
    </div>
    <div class="sec">
      <button class="btn" data-act="play">▶ 이 하이라이트 재생</button>
      <button class="btn half" data-act="tog">${c.include?'✕ 제외':'＋ 포함'}</button>
      <button class="btn half" data-act="dup" title="같은 하이라이트를 한 번 더">복제</button>
    </div>`;
  const apply=f=>{pushHist();f();renderAll();};
  // angle buttons: each cam solo + both two-cam orders; active config highlighted
  const ang=box.querySelector('#angRow'),cams=Object.keys(camMap()),cur=currentOrder(c).join('→');
  const orders=[...cams.map(x=>[x]),...(cams.length>1?cams.flatMap(x=>cams.filter(y=>y!==x).map(y=>[x,y])):[])];
  ang.innerHTML=orders.map(o=>{
    const label=o.length===1?camName(o[0])+'만':camName(o[0])+'→'+camName(o[1]);
    return `<button class="tbtn${o.join('→')===cur?' on':''}" data-ang="${o.join(',')}">${label}</button>`;
  }).join('');
  ang.querySelectorAll('[data-ang]').forEach(b=>b.onclick=()=>apply(()=>setAngles(c,b.dataset.ang.split(','))));
  box.querySelector('[data-n="in"]').onchange=e=>apply(()=>{segs[0].src_in=clamp(parseFloat(e.target.value)||0,0,segs[0].src_out-0.5);});
  const ci=box.querySelector('[data-n="cut"]');
  if(ci)ci.onchange=e=>apply(()=>{const v=parseFloat(e.target.value)||0,d=v-segs[0].src_out;segs[0].src_out=v;segs[1].src_in=Math.max(0,segs[1].src_in+d);});
  box.querySelector('[data-n="out"]').onchange=e=>apply(()=>{const g=segs[segs.length-1];g.src_out=Math.max(g.src_in+0.5,parseFloat(e.target.value)||0);});
  box.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setAtPlayhead(b.dataset.set));
  box.querySelector('[data-act="play"]').onclick=()=>{if(!c.include)return;seekSeq(offsetOf(seqClips().indexOf(c)));startPlay();};
  box.querySelector('[data-act="tog"]').onclick=()=>apply(()=>{c.include=!c.include;});
  box.querySelector('[data-act="dup"]').onclick=()=>apply(()=>{
    const i=clips.indexOf(c);
    clips.splice(i+1,0,{id:nextId++,include:true,data:JSON.parse(JSON.stringify(c.data))});
  });
}
function setAtPlayhead(which){
  const m=locate(playN);if(!m)return;
  const c=m.clip;selId=c.id;const segs=c.data.segments;
  pushHist();
  if(which==='in'&&m.seg===0)segs[0].src_in=clamp(m.src,0,segs[0].src_out-0.5);
  else if(which==='out'){const g=segs[segs.length-1];if(m.seg===segs.length-1)g.src_out=Math.max(g.src_in+0.5,m.src);}
  else if(which==='cut'&&segs.length>1){
    const u=m.seg===0?m.src-segs[0].src_in:segDur(segs[0])+(m.src-segs[1].src_in);
    const nv=clamp(segs[0].src_in+u,segs[0].src_in+0.5,segs[0].src_out+segDur(segs[1])-0.5);
    const d=nv-segs[0].src_out;segs[0].src_out=nv;segs[1].src_in=Math.max(0,segs[1].src_in+d);
  }
  renderAll();
}

/* ---- shell bindings: transport, ruler, skim, zoom, keys ---- */
function bindShell(){
  $('#tpPlay').onclick=()=>playing?stopPlay():startPlay();
  $('#tpStart').onclick=()=>seekSeq(0);
  $('#tpEnd').onclick=()=>seekSeq(seqDur());
  $('#tpPrev').onclick=()=>{const p=editPoints();for(let i=p.length-1;i>=0;i--)if(p[i]<playN-0.01)return seekSeq(p[i]);seekSeq(0);};
  $('#tpNext').onclick=()=>{for(const p of editPoints())if(p>playN+0.01)return seekSeq(p);};
  const snapT=t=>{
    if(!snapOn)return t;
    let best=t,bpx=8;
    for(const p of editPoints()){const d=Math.abs(p-t)*PXPS;if(d<bpx){bpx=d;best=p;}}
    return best;
  };
  const rulerT=cx=>{const r=$('#ntlInner').getBoundingClientRect();return clamp((cx-r.left)/PXPS,0,seqDur());};
  let phDrag=false;
  $('#nRuler').addEventListener('mousedown',e=>{phDrag=true;seekSeq(snapT(rulerT(e.clientX)));});
  $('#nPhHead').addEventListener('mousedown',e=>{e.stopPropagation();phDrag=true;});
  window.addEventListener('mousemove',e=>{if(phDrag)seekSeq(snapT(rulerT(e.clientX)));});
  window.addEventListener('mouseup',()=>phDrag=false);
  // skimming: hover over the ruler area scrubs lightly (no state change)
  $('#ntlScroll').addEventListener('mousemove',e=>{
    if(phDrag||trimming||playing)return void($('#nSkim').style.display='none');
    const t=rulerT(e.clientX);$('#nSkim').style.display='block';$('#nSkim').style.left=(t*PXPS)+'px';
  });
  $('#ntlScroll').addEventListener('mouseleave',()=>$('#nSkim').style.display='none');
  $('#nSnap').onclick=()=>{snapOn=!snapOn;$('#nSnap').classList.toggle('on',snapOn);};
  const applyZoom=v=>{PXPS=clamp(v,3,120);$('#zoom').value=Math.round(PXPS);renderTimeline();};
  $('#zoom').oninput=e=>{autoFit=false;applyZoom(+e.target.value);};
  $('#zIn').onclick=()=>{autoFit=false;applyZoom(PXPS*1.3);};
  $('#zOut').onclick=()=>{autoFit=false;applyZoom(PXPS/1.3);};
  $('#zFit').onclick=()=>{autoFit=true;renderTimeline();};
  $('#ntlScroll').addEventListener('wheel',e=>{     // pinch-zoom at cursor (webcut)
    if(!e.ctrlKey)return;e.preventDefault();
    const sc=$('#ntlScroll'),sx=e.clientX-sc.getBoundingClientRect().left;
    const tAt=(sc.scrollLeft+sx)/PXPS;autoFit=false;
    applyZoom(PXPS*Math.exp(-e.deltaY*0.01));
    sc.scrollLeft=Math.max(0,tAt*PXPS-sx);
  },{passive:false});
  $('#nUndo').onclick=undo;$('#nRedo').onclick=redo;
  window.onkeydown=e=>{
    if(!$('#edit')||$('#edit').hidden||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    const meta=e.metaKey||e.ctrlKey;
    if(meta&&(e.key==='z'||e.key==='Z')){e.preventDefault();e.shiftKey?redo():undo();return;}
    switch(e.key){
      case ' ':e.preventDefault();playing?stopPlay():startPlay();break;
      case 'i':case 'I':setAtPlayhead('in');break;
      case 'o':case 'O':setAtPlayhead('out');break;
      case 'c':case 'C':setAtPlayhead('cut');break;
      case 'n':case 'N':$('#nSnap').click();break;
      case 'ArrowLeft':e.preventDefault();seekSeq(playN-(e.shiftKey?1:1/30));break;
      case 'ArrowRight':e.preventDefault();seekSeq(playN+(e.shiftKey?1:1/30));break;
      case 'ArrowUp':e.preventDefault();$('#tpPrev').click();break;
      case 'ArrowDown':e.preventDefault();$('#tpNext').click();break;
      case 'Backspace':case 'Delete':{const c=selClip();if(c){pushHist();c.include=false;fixSel();renderAll();}break;}
    }
  };
}

/* ---- render job ---- */
async function startRender(){
  window._edOut=$('#edOut').value;window._edBgm=$('#edBgm').value;window._edVol=$('#edVol').value;
  const out={...plan,crossfade_sec:Math.max(0,parseFloat($('#edXf').value)||0),clips:seqClips().map(c=>c.data)};
  if(!out.clips.length){$('#edRstat').textContent='포함된 클립이 없습니다';return;}
  $('#edProgWrap').hidden=false;$('#edProg').style.width='0%';$('#edRstat').textContent='렌더 시작…';
  try{
    const r=await api('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({plan:out,out:window._edOut,bgm:window._edBgm||null,bgm_volume:parseFloat(window._edVol)})});
    const poll=async()=>{
      try{
        const s=await api('/api/render_status?job='+r.job);
        if(s.status==='running'){const[i,n]=s.progress||[0,1];
          $('#edProg').style.width=Math.round(i/Math.max(1,n)*100)+'%';
          $('#edRstat').textContent=i>=n?`합본·BGM 처리 중…`:`렌더 ${i}/${n}`;
          setTimeout(poll,1000);}
        else if(s.status==='done'){$('#edProg').style.width='100%';
          $('#edRstat').textContent=`✓ ${s.clips.length}클립 + 합본 → ${window._edOut}`;}
        else $('#edRstat').textContent='오류: '+(s.error||'unknown');
      }catch(e){$('#edRstat').textContent='상태 조회 실패: '+e.message;}
    };
    poll();
  }catch(e){$('#edRstat').textContent='오류: '+e.message;}
}
loadState();
</script>

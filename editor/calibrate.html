<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAHP 골 ROI 캘리브레이션</title>
<style>
  :root { --bg:#12151a; --panel:#1b2027; --line:#2b323c; --fg:#e6e9ee; --mut:#8b95a3; --accent:#4ea1ff; --ok:#37d67a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { font-size:16px; margin:0 0 4px; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  .btn { background:#232a33; color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer; font-size:13px; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#04101f; border-color:var(--accent); font-weight:600; }
  input[type=text] { background:#0e1116; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; width:120px; }
  canvas { max-width:100%; border:1px solid var(--line); border-radius:8px; cursor:crosshair; background:#000; display:block; margin-top:8px; }
  .mut { color:var(--mut); }
  code { background:#0e1116; padding:2px 6px; border-radius:4px; border:1px solid var(--line); }
  table { border-collapse:collapse; margin-top:12px; width:100%; }
  td,th { border:1px solid var(--line); padding:6px 9px; text-align:left; font-size:13px; }
  th { color:var(--mut); font-weight:500; }
</style>
</head>
<body>
<header>
  <h1>🥅 골 ROI 캘리브레이션</h1>
  <div class="mut">고정 카메라의 골망 위치를 한 번만 박스로 지정 → <code>net_rois.json</code>. 키는 파일명에 포함된 문자열(예: DJI, IMG)로.</div>
</header>
<main>
  <div class="mut">① 캠 정지 프레임 추출 예:
    <code>ffmpeg -ss 60 -i data/raw/cam1/DJI_...MP4 -frames:v 1 cam1.jpg</code></div>
  <div class="row">
    <label class="btn">② 프레임 이미지 열기<input id="img" type="file" accept="image/*" hidden></label>
    <span>키:</span><input id="key" type="text" placeholder="DJI" value="DJI">
    <button id="add" class="btn" disabled>③ 그린 박스 저장</button>
    <button id="export" class="btn primary" disabled>④ net_rois.json 내보내기</button>
  </div>
  <div class="mut">이미지 위에서 골망 영역을 드래그해 박스를 그리세요.</div>
  <canvas id="cv" width="720" height="405"></canvas>
  <table id="tbl"><thead><tr><th>키</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th></tr></thead><tbody></tbody></table>
</main>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let img=null, natW=0, natH=0, scale=1;
let box=null;                 // {x,y,w,h} in canvas px
let drag=null;
const rois={};                // key -> [x,y,w,h] normalized

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(img) ctx.drawImage(img,0,0,cv.width,cv.height);
  if(box){ ctx.strokeStyle='#37d67a'; ctx.lineWidth=2; ctx.strokeRect(box.x,box.y,box.w,box.h);
           ctx.fillStyle='rgba(55,214,122,.15)'; ctx.fillRect(box.x,box.y,box.w,box.h); }
}

$('#img').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  img=new Image();
  img.onload=()=>{
    natW=img.naturalWidth; natH=img.naturalHeight;
    const dispW=Math.min(720,natW); scale=dispW/natW;
    cv.width=dispW; cv.height=Math.round(natH*scale);
    box=null; $('#add').disabled=true; draw();
  };
  img.src=URL.createObjectURL(f);
};

function pos(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height)}; }
cv.onmousedown=e=>{ if(!img)return; const p=pos(e); drag={x0:p.x,y0:p.y}; };
cv.onmousemove=e=>{ if(!drag)return; const p=pos(e);
  box={x:Math.min(drag.x0,p.x),y:Math.min(drag.y0,p.y),w:Math.abs(p.x-drag.x0),h:Math.abs(p.y-drag.y0)};
  draw(); };
window.onmouseup=()=>{ if(drag&&box&&box.w>4&&box.h>4) $('#add').disabled=false; drag=null; };

$('#add').onclick=()=>{
  const key=$('#key').value.trim(); if(!key||!box) return;
  // normalize by natural size (canvas is scaled copy)
  rois[key]=[ +(box.x/cv.width).toFixed(4), +(box.y/cv.height).toFixed(4),
              +(box.w/cv.width).toFixed(4), +(box.h/cv.height).toFixed(4) ];
  renderTbl(); $('#export').disabled=false;
};

function renderTbl(){
  const tb=$('#tbl tbody'); tb.innerHTML='';
  for(const [k,v] of Object.entries(rois)){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${k}</td>`+v.map(n=>`<td>${n}</td>`).join('')+
      `<td><button class="btn" data-del="${k}">삭제</button></td>`;
    tr.querySelector('[data-del]').onclick=()=>{ delete rois[k]; renderTbl();
      if(!Object.keys(rois).length) $('#export').disabled=true; };
    tb.appendChild(tr);
  }
}

$('#export').onclick=()=>{
  const blob=new Blob([JSON.stringify(rois,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='net_rois.json'; a.click();
};
draw();
</script>
</body>
</html>

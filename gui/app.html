<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoPitch 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f1216;--panel:#191f27;--line:#2a323d;--fg:#e7ebf0;--mut:#8b95a3;--accent:#4ea1ff;--ok:#37d67a;--drop:#ff6b6b;}
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 'Noto Sans KR',-apple-system,Segoe UI,Roboto,sans-serif;}
  button,input,select{font-family:inherit;}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;}
  header h1{font-size:15px;margin:0 14px 0 0;}
  .tab{background:none;border:none;color:var(--mut);padding:8px 12px;cursor:pointer;border-radius:7px;font-size:13px;}
  .tab.on{background:#232b34;color:var(--fg);}
  #root{margin-left:auto;color:var(--mut);font-size:12px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{max-width:1000px;margin:0 auto;padding:16px;}
  .btn{background:#232a33;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;}
  .btn:hover{border-color:var(--accent);} .btn.primary{background:var(--accent);color:#04101f;border-color:var(--accent);font-weight:600;}
  .btn.sm{padding:3px 7px;font-size:12px;} .btn:disabled{opacity:.4;cursor:default;}
  input,select{background:#0e1116;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;}
  input[type=number]{width:80px;font-variant-numeric:tabular-nums;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .mut{color:var(--mut);} .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;}
  canvas{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:crosshair;background:#000;display:block;}
  video{width:100%;max-height:300px;background:#000;border-radius:8px;}
  .tl{position:relative;height:40px;background:#0b0e12;border:1px solid var(--line);border-radius:6px;margin-top:8px;touch-action:none;cursor:pointer;}
  .tl .blk{position:absolute;top:6px;bottom:6px;border-radius:4px;font-size:10px;line-height:1;color:#e8eef5;overflow:hidden;padding:3px 5px;pointer-events:none;white-space:nowrap;}
  .tl .b0{background:rgba(47,93,138,.55);} .tl .b1{background:rgba(138,90,47,.55);}
  .tl .wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:none;background:transparent;border-radius:6px;}
  .tl .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;}
  .tl .hd{position:absolute;top:-4px;bottom:-4px;width:10px;margin-left:-5px;cursor:ew-resize;border-radius:3px;background:var(--accent);}
  .tl .hd.hcut{background:var(--ok);}
  .prog{height:8px;background:#0e1116;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
  .clip:focus{outline:1px solid var(--accent);}
  /* ---- NLE editor (webcut-style) ---- */
  main.wide{max-width:none;padding:0;}
  .nle{display:grid;grid-template-rows:auto minmax(0,1fr) 218px;grid-template-columns:minmax(0,1fr);height:calc(100vh - 47px);}
  .nle>*{min-width:0;}
  .nle-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;}
  .nle-top{display:grid;grid-template-columns:236px minmax(0,1fr) 268px;min-height:0;}
  .npane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .npane:last-child{border-right:none;}
  .npane .hd{padding:7px 10px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);background:var(--panel);}
  .npane .bd{overflow-y:auto;flex:1;min-height:0;padding:8px;}
  .lib-item{padding:7px 9px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12px;display:flex;gap:6px;align-items:center;}
  .lib-item.sel{border-color:var(--accent);background:#182230;}
  .lib-item.off{opacity:.45;}
  .lib-item .t{font-weight:600;}
  .lib-item .mut{margin-left:auto;}
  .viewer{display:flex;flex-direction:column;min-height:0;}
  .viewer video{flex:1;min-height:0;width:100%;max-height:none;object-fit:contain;background:#000;border-radius:0;}
  .transport{display:flex;gap:6px;align-items:center;justify-content:center;padding:7px;background:var(--panel);border-top:1px solid var(--line);}
  .transport .time{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px;min-width:120px;text-align:center;}
  .insp .sec{border-bottom:1px solid var(--line);padding:9px 10px;}
  .insp .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .insp .kv{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;flex-wrap:wrap;}
  .insp input[type=number]{width:74px;padding:4px 6px;}
  .insp .btn{width:100%;margin-top:5px;text-align:center;}
  .insp .btn.half{width:calc(50% - 3px);display:inline-block;}
  /* timeline */
  .ntl{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);background:#0d1014;}
  .ntl-bar{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);}
  .ntl-bar input[type=range]{width:110px;}
  .ntl-scroll{overflow-x:auto;overflow-y:hidden;flex:1;position:relative;min-width:0;}
  .ntl-inner{position:relative;height:100%;min-width:100%;}
  .nruler{position:relative;height:22px;border-bottom:1px solid var(--line);cursor:pointer;}
  .nruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2b323d;color:#64707f;font-size:10px;padding:3px 0 0 4px;user-select:none;}
  .nlane{position:relative;height:96px;margin-top:14px;}
  .nclip{position:absolute;top:0;height:96px;background:#141a22;border:1px solid #2b3644;border-radius:7px;overflow:hidden;cursor:grab;}
  .nclip.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .nclip .nwave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:none;background:transparent;}
  .nclip .nseg{position:absolute;top:0;bottom:0;pointer-events:none;}
  .nclip .nseg.s0{background:rgba(47,93,138,.35);}
  .nclip .nseg.s1{background:rgba(138,90,47,.35);}
  .nclip .nlabel{position:absolute;left:6px;top:4px;font-size:11px;color:#dfe7f0;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;}
  .nclip .ncams{position:absolute;left:6px;bottom:4px;font-size:10px;color:#9fb0c2;text-shadow:0 1px 2px #000;pointer-events:none;}
  .nclip .trim{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(78,161,255,.25);}
  .nclip .trim.l{left:0;border-radius:7px 0 0 7px;} .nclip .trim.r{right:0;border-radius:0 7px 7px 0;}
  .nclip .trim:hover{background:rgba(78,161,255,.6);}
  .nclip .ncut{position:absolute;top:0;bottom:0;width:9px;margin-left:-4.5px;cursor:ew-resize;background:rgba(55,214,122,.45);}
  .nclip .ncut:hover{background:rgba(55,214,122,.8);}
  .nclip .ndel{position:absolute;right:11px;top:3px;background:none;border:none;color:#8b95a3;cursor:pointer;font-size:12px;}
  .nclip .ndel:hover{color:var(--drop);}
  .nph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:5;}
  .nph .head{position:absolute;top:0;left:-5px;width:12px;height:12px;background:#fff;border-radius:0 0 6px 6px;pointer-events:auto;cursor:ew-resize;}
  .nskim{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);pointer-events:none;z-index:4;display:none;}
  .ntl-empty{color:var(--mut);font-size:12px;padding:30px 16px;}
  .tbtn{background:#232a33;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px;}
  .tbtn.on{border-color:var(--accent);color:var(--accent);}
  .tbtn:disabled{opacity:.4;}
  code{background:#0e1116;padding:1px 5px;border-radius:4px;border:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;margin-top:8px;} td,th{border:1px solid var(--line);padding:5px 8px;font-size:12px;text-align:left;}
  .seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin:3px 0;}
  .clip.excluded{opacity:.45;}
  .t{color:var(--accent);font-variant-numeric:tabular-nums;}
  .setup-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start;}
  .status-list{display:grid;gap:7px;margin-top:8px;}
  .status-item{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px;background:#141a22;}
  .status-item.ok{border-color:rgba(55,214,122,.55);} .status-item.warn{border-color:rgba(255,197,92,.55);} .status-item.err{border-color:rgba(255,107,107,.6);}
  .status-ico{font-size:13px;text-align:center;margin-top:1px;}
  .status-title{font-weight:600;font-size:13px;} .status-desc{font-size:12px;color:var(--mut);margin-top:1px;}
  .cam-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px;}
  .cam-box{border:1px solid var(--line);border-radius:8px;padding:8px;background:#11161d;font-size:12px;min-height:74px;}
  .cam-box b{display:block;margin-bottom:3px;} .cam-box .files{color:var(--mut);font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;}
  .choice{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
  .choice .tbtn{padding:7px 10px;}
  .next-box{border:1px solid rgba(78,161,255,.45);background:#121b27;border-radius:8px;padding:10px;margin-top:10px;}
  .job-panel{flex-basis:100%;display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#111820;}
  .job-panel[hidden]{display:none;}
  .job-panel .prog{margin:0;height:9px;}
  .job-title{font-size:12px;font-weight:600;}
  .job-detail{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;}
  .modal-back[hidden]{display:none;}
  .modal{width:min(520px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.45);}
  .modal .mh{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;}
  .modal .mb{padding:12px 14px;}
  .modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);}
  .field{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:center;margin:8px 0;}
  .field input{width:100%;}
  .dir-row{display:flex;gap:8px;align-items:center;margin:7px 0;}
  .dir-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0e1116;padding:6px;}
  .dir-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:2px 0;padding:7px 8px;background:#151b23;border:1px solid var(--line);border-radius:7px;color:var(--fg);cursor:pointer;}
  .dir-item:hover{border-color:var(--accent);}
  @media(max-width:760px){.setup-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>🎬 autoPitch 스튜디오</h1>
  <button class="tab on" data-tab="setup">① 설정</button>
  <button class="tab" data-tab="cal">② 골 ROI</button>
  <button class="tab" data-tab="edit">③ 편집·렌더</button>
  <button class="tab" data-tab="ana">④ 분석</button>
  <span id="root">–</span>
</header>
<main>
  <section id="setup"></section>
  <section id="cal" hidden></section>
  <section id="edit" hidden></section>
  <section id="ana" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(p,o)=>{const r=await fetch(p,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j;};
const post=(p,o)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const round=(n,d=2)=>Math.round(n*10**d)/10**d;
let STATE={root:'',games:[],rois_exists:false,view_settings:{flips:{}}};
const gameCams=g=>g.cameras||[
  ...(g.cam1?[{id:'cam1',path:g.cam1,dur:g.dur1}]:[]),
  ...(g.cam2?[{id:'cam2',path:g.cam2,dur:g.dur2}]:[])
];
const gameKey=g=>g.game_key||String(g.game);
const gameNo=g=>g.game_no||g.game;
const sessions=()=>Array.from(new Map((STATE.games||[]).map(g=>[g.session||'root',{
  id:g.session||'root',label:g.session_label||'기본'
}])).values());
const gamesForSession=sid=>(STATE.games||[]).filter(g=>(g.session||'root')===sid);
let setupSession=null;
const activeSession=()=>window._edSession||setupSession||sessions()[0]?.id||'root';

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  ['setup','cal','edit','ana'].forEach(id=>$('#'+id).hidden = id!==b.dataset.tab);
  document.querySelector('main').classList.toggle('wide', b.dataset.tab==='edit');
  if(b.dataset.tab==='cal') renderCal();
  if(b.dataset.tab==='edit') renderEdit();
  if(b.dataset.tab==='ana') renderAna();
});

async function loadState(){ STATE=await api('/api/state'); $('#root').textContent='📁 '+STATE.root; renderSetup(); }

/* ---------- ① SETUP ---------- */
let setupCamCount=2;

/* ── ④ 분석 : 팀 히트맵 · 점유 영역 ─────────────────────────────────────
   개인 추적은 이 카메라 각도에선 신뢰할 수 없다(실측: 11명 → 109 ID).
   그래서 ID 없이 되는 것만 — 팀별 점유 히트맵과 활동 폭을 본다.        */
let anaJob=null, anaData=null, anaQuad=[], anaCam=null;

async function renderAna(){
  const st=await api('/api/state');
  const games=(st.games||[]);
  const quads=await api('/api/court_quad').catch(()=>({}));
  $('#ana').innerHTML=`
   <div class="pane">
    <h2>경기 분석 · 팀 활동 영역</h2>
    <p class="hint">선수 개인 추적은 이 각도에선 끊깁니다(11명 → 109 ID 측정).
       ID가 필요 없는 <b>팀 단위 점유</b>만 분석합니다.</p>
    <div class="row">
      <label>경기 <select id="anaGame">${games.map((g,i)=>
        `<option value="${i}">${g.session_label||''} ${gameNo(g)}경기 · ${mmss(g.overlap||0)}</option>`).join('')}</select></label>
      <label>구간 <select id="anaSeg">
        <option value="full">전체 경기</option>
        <option value="first">전반</option>
        <option value="second">후반</option>
        <option value="sample" selected>표본 3분(빠름)</option>
      </select></label>
      <label>카메라 <select id="anaCam">
        <option value="0" selected>카메라 1</option>
        <option value="1">카메라 2</option>
        <option value="all">양쪽(코트 보정 필요)</option>
      </select></label>
      <button id="anaRun" class="primary">분석 실행</button>
    </div>
    <p class="hint" id="anaPlan"></p>
    <div class="row"><span id="anaStat" class="hint"></span></div>
    <div class="row" style="margin-top:4px">
      <span id="anaQuadState" class="hint"></span>
      <details style="margin-left:auto"><summary class="hint">코트 보정(선택)</summary>
        <p class="hint" style="max-width:520px">코트 네 모퉁이를 찍으면 점유율(%)과 카메라 융합이 켜집니다.
        이 앵글에선 모퉁이가 화면 밖이거나 흐려 찍기 어려울 수 있고, 잘못 찍으면 틀린 점유율이 나옵니다.
        자신 없으면 <b>건너뛰세요</b> — 히트맵은 보정 없이도 정확합니다.</p>
        <button id="anaCal">코트 4점 찍기</button>
      </details>
    </div>
    <div id="anaOut" style="margin-top:12px"></div>
   </div>`;
  window._anaGames=games; window._anaQuads=quads;
  const upd=()=>{
    const g=games[+$('#anaGame').value]||{}; const cams=gameCams(g);
    const ov=g.overlap||0, seg=$('#anaSeg').value;
    const plan={full:[0,ov],first:[0,ov/2],second:[ov/2,ov/2],sample:[Math.max(0,ov/2-90),180]}[seg];
    const fps=seg==='sample'?5:1;                 // 전체를 훑을 땐 저속 샘플링
    window._anaRange={start:Math.round(plan[0]),dur:Math.round(plan[1]),fps};
    const n=Math.round(plan[1]*fps);
    $('#anaPlan').innerHTML=`→ ${mmss(plan[0])}부터 ${mmss(plan[1])} 동안 · 초당 ${fps}장 ·
       약 ${n.toLocaleString()}프레임 · 예상 ${Math.max(1,Math.round(n*0.18/60))}분`;
    const sel=$('#anaCam').value;
    const use=sel==='all'?cams:[cams[+sel]].filter(Boolean);
    const miss=use.filter(c=>!quads[c.path]).length;
    $('#anaQuadState').innerHTML=miss===0
      ? `<b style="color:#37d67a">코트 보정됨</b> — 점유율·융합 사용`
      : `카메라 시점 히트맵 <span style="color:#8b95a3">(코트 미보정 — 기본 모드)</span>`;
    if(sel==='all'&&miss>0){
      $('#anaQuadState').innerHTML+=' <b style="color:#f0b429">· 융합은 보정 후 가능, 카메라 1만 분석됩니다</b>';
    }
  };
  ['anaGame','anaSeg','anaCam'].forEach(id=>$('#'+id).onchange=upd);
  upd();
  $('#anaRun').onclick=startAna;
  $('#anaCal').onclick=()=>{
    const g=games[+$('#anaGame').value]; const cams=gameCams(g);
    const sel=$('#anaCam').value;
    calibrateCourt((sel==='all'?cams[0]:cams[+sel]).path);
  };
}

async function startAna(){
  const g=window._anaGames[+$('#anaGame').value]; const cams=gameCams(g);
  const sel=$('#anaCam').value;
  const use=(sel==='all'?cams:[cams[+sel]].filter(Boolean)).map(c=>c.path);
  const {start,dur,fps}=window._anaRange;
  const r=await post('/api/analysis_start',{sources:use,start,dur,fps});
  anaJob=r.job; pollAna();
}

async function pollAna(){
  const j=await api('/api/analysis_status?job='+anaJob);
  $('#anaStat').textContent=`${j.stage||''} ${j.percent||0}%`;
  if(j.status==='running'){ setTimeout(pollAna,700); return; }
  if(j.status==='error'){ $('#anaStat').textContent='실패: '+j.error; return; }
  anaData=j.result; drawAna(j.result);
}

function drawAna(d){
  const [gh,gw]=d.heatmap.grid, A=d.heatmap.A, B=d.heatmap.B;
  const mx=Math.max(1,...A.flat(),...B.flat());
  const cv=document.createElement('canvas'); cv.width=gw*10; cv.height=gh*10;
  cv.style.cssText='width:100%;max-width:900px;border-radius:8px;background:#0c1015';
  const c=cv.getContext('2d');
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const a=A[y][x]/mx, b=B[y][x]/mx;
    if(a>0.02){c.fillStyle=`rgba(78,161,255,${Math.min(0.9,a*1.6)})`;c.fillRect(x*10,y*10,10,10);}
    if(b>0.02){c.fillStyle=`rgba(240,180,41,${Math.min(0.9,b*1.6)})`;c.fillRect(x*10,y*10,10,10);}
  }
  const t=d.teams, pct=v=>v==null?'–':Math.round(v*100)+'%';
  $('#anaOut').innerHTML=`
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
      <div id="anaCv"></div>
      <table class="tbl">
        <tr><th></th><th style="color:#4ea1ff">팀 A</th><th style="color:#f0b429">팀 B</th></tr>
        <tr><td>검출 수</td><td>${t.A.n.toLocaleString()}</td><td>${t.B.n.toLocaleString()}</td></tr>
        <tr><td>활동 폭(px)</td><td>${t.A.spread_px.toFixed(0)}</td><td>${t.B.spread_px.toFixed(0)}</td></tr>
        <tr><td>자기 진영 점유</td><td>${pct(t.A.own_half_share)}</td><td>${pct(t.B.own_half_share)}</td></tr>
      </table>
    </div>
    <p class="hint">${d.frames}프레임 · 검출 ${d.detections.toLocaleString()}개 ·
      ${d.merged?`<b style="color:#37d67a">카메라 ${d.cameras}대 융합</b>`
                 :(d.cameras>1?'카메라별 개별 분석':'단일 카메라')} ·
      ${d.calibrated?'코트 보정됨':'<b>코트 미보정</b> — 점유율은 보정 후 표시'}
      ${d.note?`<br><span style="color:#f0b429">${d.note}</span>`:''}</p>`;
  $('#anaCv').appendChild(cv);
}

/* 코트 4점 보정: 프레임 위에 좌상→우상→우하→좌하 순서로 클릭 */
async function calibrateCourt(src){
  anaCam=src; anaQuad=[];
  const img=new Image();
  img.src='/api/frame?path='+encodeURIComponent(src)+'&t=600';
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height;
    cv.style.cssText='width:100%;max-width:1000px;cursor:crosshair;border-radius:8px';
    const c=cv.getContext('2d'); c.drawImage(img,0,0);
    cv.onclick=async ev=>{
      const r=cv.getBoundingClientRect();
      const x=(ev.clientX-r.left)/r.width*cv.width, y=(ev.clientY-r.top)/r.height*cv.height;
      anaQuad.push([x,y]);
      c.fillStyle='#37d67a'; c.beginPath(); c.arc(x,y,7,0,7); c.fill();
      c.fillStyle='#fff'; c.font='16px sans-serif'; c.fillText(anaQuad.length,x+10,y-8);
      if(anaQuad.length===4){
        await post('/api/court_quad',{cam:src,quad:anaQuad});
        $('#anaOut').innerHTML='<p class="hint">코트 보정 저장됨. 다시 분석하면 점유율이 나옵니다.</p>';
      }
    };
    $('#anaOut').innerHTML='<p class="hint">코트 네 귀퉁이를 <b>좌상 → 우상 → 우하 → 좌하</b> 순서로 클릭하세요.</p>';
    $('#anaOut').appendChild(cv);
  };
}

    {ok:allGames.length>0,warn:allFiles>0&&!allGames.length,title:'경기 감지',desc:allGames.length?`${allGames.length}개 경기를 편집할 수 있습니다.`:(allFiles?'영상은 있지만 아직 경기로 묶지 못했습니다. 여러 카메라 촬영본은 촬영시각 메타데이터가 필요합니다.':'영상이 들어오면 여기에 경기 목록이 표시됩니다.')},

        : !allFiles

        : allGames.length

          : {title:'영상은 찾았지만 경기 목록이 비어 있습니다',desc:'단일캠은 cam1만 사용하세요. 여러 카메라는 각 cam 폴더의 파일 수와 촬영시각이 맞는지 확인한 뒤 새로고침하세요.',actions:'refresh'};

          <div class="row"><input id="rootIn" style="flex:1" value="${STATE.root}">
            <button class="btn" id="setRoot">확인</button>
            <button class="btn" id="reloadState">새로고침</button></div>
          <div class="status-list">

              <div class="status-ico">${s.ok?'✓':(s.warn?'!':'·')}</div>
              <div><div class="status-title">${s.title}</div><div class="status-desc">${s.desc}</div></div>

          </div>
          <div class="next-box">
            <div class="status-title">${next.title}</div>

            ${next.actions==='refresh'?`<div class="choice"><button class="btn primary" id="refreshOnly">다시 확인</button></div>`:''}
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="row"><b>카메라 입력</b><span class="mut">${totalFiles}개 파일 · 전체 ${allFiles}개</span></div>
          ${ss.length>1?`<div class="row"><span class="mut">날짜 폴더</span><select id="setupSession">${ss.map(s=>`<option value="${s.id}" ${s.id===setupSession?'selected':''}>${s.label}</option>`).join('')}</select></div>`:''}
          ${cams.length?`<div class="cam-grid">${cams.map(c=>`<div class="cam-box"><b>${c.id}</b><div>${c.count}개 영상</div><div class="files">${c.files.length?c.files.join('<br>'):'비어 있음'}</div></div>`).join('')}</div>`
            :'<div class="mut">아직 카메라 폴더가 없습니다. 촬영 방식 선택 후 작업 공간을 준비하세요.</div>'}
        </div>
        <div class="card">
          <div class="row"><b>감지된 경기</b> ${STATE.rois_exists?'<span class="mut">ROI 저장됨</span>':'<span class="mut">ROI 미설정</span>'}</div>
          ${g.length?`<table><tr><th>날짜</th><th>경기</th>${camHeaders}<th>겹침</th></tr>
            ${g.map(x=>{const gc=gameCams(x);return `<tr><td>${x.session_label||'기본'}</td><td>${gameNo(x)}</td>${Array.from({length:maxCams},(_,i)=>`<td>${gc[i]?gc[i].path.split('/').pop():''}</td>`).join('')}<td>${mmss(x.overlap)}</td></tr>`;}).join('')}</table>`
            :'<div class="mut">아직 편집 가능한 경기가 없습니다.</div>'}
        </div>
      </div>
    </div>`;
  const refresh=async()=>{STATE=await api('/api/state');$('#root').textContent='📁 '+STATE.root;renderSetup();};
  $('#setRoot').onclick=async()=>{ try{ STATE=await api('/api/root',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('#rootIn').value})}); $('#root').textContent='📁 '+STATE.root; renderSetup(); }catch(e){alert(e.message);} };
  $('#reloadState').onclick=()=>refresh().catch(e=>alert(e.message));
  $('#setupSession')?.addEventListener('change',e=>{setupSession=e.target.value;window._edSession=setupSession;renderSetup();});
  $('#refreshOnly')?.addEventListener('click',()=>refresh().catch(e=>alert(e.message)));
  $('#goEdit')?.addEventListener('click',()=>{window._edSession=setupSession;document.querySelector('[data-tab="edit"]').click();});
  $('#goCal')?.addEventListener('click',()=>{window._edSession=setupSession;document.querySelector('[data-tab="cal"]').click();});

  $('#prepFolders')?.addEventListener('click',async()=>{try{STATE=await api('/api/prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cams:setupCamCount})});$('#root').textContent='📁 '+STATE.root;renderSetup();}catch(e){alert(e.message);}});

/* ---------- ② CALIBRATION ---------- */
let calImg=null, calBox=null, calDrag=null, rois={}, viewSettings={flips:{}};
async function renderCal(){
  rois=await api('/api/rois').catch(()=>({}));
  viewSettings=await api('/api/view_settings').catch(()=>STATE.view_settings||{flips:{}});
  viewSettings.flips=viewSettings.flips||{};
  const ss=sessions();
  const calSession=activeSession();
  window._edSession=calSession;
  setupSession=calSession;
  const sessionGames=gamesForSession(calSession);
  const camItems=[];
  const seen=new Set();
  sessionGames.flatMap(gameCams).forEach(c=>{if(c.path&&!seen.has(c.path)){seen.add(c.path);camItems.push(c);}});
  const cams=camItems.map(c=>c.path);
  const camByPath=Object.fromEntries(camItems.map(c=>[c.path,c]));
  const camId=p=>(camByPath[p]&&camByPath[p].id)||'cam1';
  const keyGuess=p=>p;
  const camPathLabel=p=>`${camId(p)} · ${p.split('/').pop()}`;
  $('#cal').innerHTML=`
    <div class="card">
      <div class="row"><b>골망 ROI 캘리브레이션</b> <span class="mut">파일마다 가까운 골망 하나를 드래그로 박스. 경기·카메라별 프레임 차이를 따로 저장합니다.</span></div>
      <div class="row">
        <select id="calSession">${ss.map(s=>`<option value="${s.id}" ${s.id===calSession?'selected':''}>${s.label}</option>`).join('')}</select>
        <select id="calCam"></select>
        <label class="mut"><input id="calFlip" type="checkbox"> 좌우 반전</label>
        <button class="tbtn" id="calFlipCam" title="현재 날짜의 같은 cam 전체에 반전 설정 적용">같은 cam 전체 적용</button>
        <label class="mut">시각(초) <input id="calT" type="number" value="60" step="5"></label>
        <button class="btn" id="calGrab">프레임 새로고침</button>
        <input id="calKey" type="hidden">
        <span id="calStat" class="mut"></span>
        <button class="btn primary" id="calSave" style="margin-left:auto">net_rois.json 저장</button>
      </div>
      <canvas id="calCv" width="720" height="405"></canvas>
      <div class="mut" style="margin:6px 0 0">골망을 드래그하면 <b>현재 파일 전용 ROI</b>로 자동 저장됩니다. 다시 그리면 갱신, 아래 표에서 삭제.</div>
      <table id="calTbl"></table>
    </div>`;
  const cv=$('#calCv'),ctx=cv.getContext('2d');
  const curKey=()=>$('#calKey').value.trim();
  const isFlippedKey=key=>!!viewSettings.flips[key];
  const isFlipped=()=>isFlippedKey(curKey());
  const viewToStore=(box,key=curKey())=>isFlippedKey(key)?{x:cv.width-box.x-box.w,y:box.y,w:box.w,h:box.h}:box;
  const storeToView=(box,key=curKey())=>isFlippedKey(key)?{x:cv.width-box.x-box.w,y:box.y,w:box.w,h:box.h}:box;
  const calMsg=(txt,color)=>{ctx.fillStyle='#0e1116';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle=color;ctx.font='14px sans-serif';ctx.fillText(txt,20,cv.height/2);};
  const fillCams=()=>{
    const sel=$('#calCam'), keep=sel.value;
    sel.innerHTML=cams.map(c=>{const done=rois[keyGuess(c)]?' ✓':'';return `<option value="${c}">${camPathLabel(c)}${done}</option>`;}).join('');
    if(keep&&cams.includes(keep))sel.value=keep;
  };
  const restoreBox=()=>{const v=rois[curKey()];calBox=v?storeToView({x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height}):null;};
  const updStat=()=>{$('#calStat').textContent=rois[curKey()]?'✓ 이 파일 저장됨':'미설정 — 골망을 드래그';};
  window.drawCal=()=>{ctx.clearRect(0,0,cv.width,cv.height);
    if(calImg){
      if(isFlipped()){ctx.save();ctx.translate(cv.width,0);ctx.scale(-1,1);ctx.drawImage(calImg,0,0,cv.width,cv.height);ctx.restore();}
      else ctx.drawImage(calImg,0,0,cv.width,cv.height);
    }
    if(calBox){ctx.strokeStyle='#37d67a';ctx.lineWidth=2;ctx.strokeRect(calBox.x,calBox.y,calBox.w,calBox.h);ctx.fillStyle='rgba(55,214,122,.15)';ctx.fillRect(calBox.x,calBox.y,calBox.w,calBox.h);}};
  let calReq=0, calShownKey=null;   // token to discard stale loads + key of the frame ACTUALLY shown
  const grab=()=>{
    if(!cams.length){
      calImg=null; calBox=null; calShownKey=null;
      calMsg('선택한 날짜 폴더에 편집 가능한 카메라 영상이 없습니다.','#8b95a3');
      return;
    }
    const myReq=++calReq;
    const cam=$('#calCam').value, key=curKey(), t=$('#calT').value;   // capture key at request time
    calImg=null; calBox=null; calShownKey=null;
    calMsg('프레임 불러오는 중… (원본이 커서 몇 초 걸릴 수 있어요)','#8b95a3');
    const im=new Image();
    im.onload=()=>{ if(myReq!==calReq) return;   // a newer switch happened -> ignore this stale frame
      calImg=im; calShownKey=key;
      const w=Math.min(720,im.naturalWidth); cv.width=w; cv.height=Math.round(im.naturalHeight*w/im.naturalWidth);
      const v=rois[key]; calBox=v?storeToView({x:v[0]*cv.width,y:v[1]*cv.height,w:v[2]*cv.width,h:v[3]*cv.height},key):null;  // restore THIS key's box
      drawCal(); updStat();
    };
    im.onerror=()=>{ if(myReq!==calReq) return; calImg=null; calMsg('프레임 로드 실패 — 서버가 켜져 있는지 확인하세요 (gui/server.py)','#ff6b6b'); };
    im.src=`/api/frame?path=${encodeURIComponent(cam)}&t=${t}`;
  };
  fillCams();
  $('#calKey').value=cams.length?keyGuess($('#calCam').value):'';
  $('#calSession').onchange=e=>{window._edSession=e.target.value;setupSession=e.target.value;renderCal();};
  const syncFlip=()=>{$('#calFlip').checked=isFlipped();};
  $('#calCam').onchange=()=>{$('#calKey').value=keyGuess($('#calCam').value);syncFlip();grab();};
  $('#calKey').oninput=()=>{if(calImg)calShownKey=curKey();syncFlip();restoreBox();drawCal();updStat();};
  $('#calFlip').onchange=async e=>{
    const key=curKey();
    if(!key)return;
    if(e.target.checked)viewSettings.flips[key]=true;else delete viewSettings.flips[key];
    await api('/api/view_settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(viewSettings)});
    if(plan){plan.video_flips=Object.fromEntries(Object.entries(viewSettings.flips).filter(([,v])=>v));clips.forEach(c=>c.data.segments.forEach(s=>{if(s.src_rel===key)s.hflip=!!viewSettings.flips[key];}));}
    restoreBox();drawCal();
  };
  $('#calFlipCam').onclick=async()=>{
    const id=camId(curKey()), on=$('#calFlip').checked;
    if(!curKey())return;
    camItems.filter(c=>c.id===id).forEach(c=>{if(on)viewSettings.flips[c.path]=true;else delete viewSettings.flips[c.path];});
    await api('/api/view_settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(viewSettings)});
    if(plan){plan.video_flips=Object.fromEntries(Object.entries(viewSettings.flips).filter(([,v])=>v));clips.forEach(c=>c.data.segments.forEach(s=>{if(camItems.some(ci=>ci.id===id&&ci.path===s.src_rel))s.hflip=on;}));}
    fillCams();syncFlip();restoreBox();drawCal();
    $('#calStat').textContent=`✓ ${id} 전체 ${on?'좌우 반전 적용':'좌우 반전 해제'}`;
  };
  $('#calGrab').onclick=grab;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
  cv.onmousedown=e=>{if(calImg){const p=pos(e);calDrag={x0:p.x,y0:p.y};}};
  cv.onmousemove=e=>{if(!calDrag)return;const p=pos(e);calBox={x:Math.min(calDrag.x0,p.x),y:Math.min(calDrag.y0,p.y),w:Math.abs(p.x-calDrag.x0),h:Math.abs(p.y-calDrag.y0)};drawCal();};
  window.onmouseup=()=>{
    // save to the key of the frame ACTUALLY on screen, never a stale #calKey
    if(calDrag&&calBox&&calBox.w>6&&calBox.h>6&&calShownKey){
      const b=viewToStore(calBox,calShownKey);
      rois[calShownKey]=[round(b.x/cv.width,4),round(b.y/cv.height,4),round(b.w/cv.width,4),round(b.h/cv.height,4)];
      calTbl();fillCams();$('#calKey').value=calShownKey;updStat();}
    calDrag=null;
  };
  window.calTbl=()=>{const t=$('#calTbl'), visible=new Set(cams);
    const rows=Object.entries(rois).filter(([k])=>visible.has(k)).map(([k,v])=>`<tr${k===curKey()?' style="background:#232b34"':''}><td><b>${k}</b></td>${v.map(n=>`<td>${n}</td>`).join('')}<td><button class="btn sm" data-del="${k}">삭제</button></td></tr>`).join('');
    t.innerHTML='<tr><th>현재 날짜 파일</th><th>x</th><th>y</th><th>w</th><th>h</th><th></th></tr>'+(rows||'<tr><td colspan="6" class="mut">현재 날짜 폴더에 저장된 ROI가 없습니다 — 파일 선택 후 골망을 드래그하세요</td></tr>');
    t.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del;delete rois[k];if(k===curKey())calBox=null;calTbl();fillCams();drawCal();updStat();});};
  $('#calSave').onclick=async()=>{

let playN=0, playing=false, curIdx=0, curSeg=0, rafId=null, lastTs=0, switching=false;

const camName=p=>{
  if(plan&&plan.camera_labels&&plan.camera_labels[p])return plan.camera_labels[p];
  const n=(p||'').split('/').pop();
  return (n.match(/^cam\d+/i)||n.match(/^[A-Za-z0-9]+/)||['cam'])[0].toLowerCase();
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- sequence model: included clips in order; u walks through every segment ---- */
const segDur=g=>g.src_out-g.src_in;
const clipDur=c=>c.data.segments.reduce((a,g)=>a+segDur(g),0);
const seqClips=()=>clips.filter(c=>c.include);
const seqDur=()=>seqClips().reduce((a,c)=>a+clipDur(c),0);
const offsetOf=i=>{let x=0;const sc=seqClips();for(let k=0;k<i;k++)x+=clipDur(sc[k]);return x;};
function locate(t){ // seq time -> {idx, seg, src, rel}
  const sc=seqClips(); let x=0;
  for(let i=0;i<sc.length;i++){
    const c=sc[i], d=clipDur(c);
    if(t<x+d||i===sc.length-1){
      let u=clamp(t-x,0,d), acc=0;
      const s=c.data.segments;
      for(let j=0;j<s.length;j++){
        const sd=segDur(s[j]);
        if(u<=acc+sd||j===s.length-1){
          return{idx:i,seg:j,src:s[j].src_in+Math.min(Math.max(0,u-acc),sd),rel:s[j].src_rel,hflip:!!s[j].hflip,clip:c};
        }
        acc+=sd;
      }
    }
    x+=d;
  }
  return null;
}
function editPoints(){const pts=[0];let x=0;for(const c of seqClips()){let u=0;const s=c.data.segments;for(let i=0;i<s.length-1;i++){u+=segDur(s[i]);pts.push(x+u);}x+=clipDur(c);pts.push(x);}return pts;}

/* ---- undo/redo ---- */
const snapState=()=>clips.map(c=>({id:c.id,include:c.include,data:JSON.parse(JSON.stringify(c.data))}));
function pushHist(){hist.push(snapState());if(hist.length>60)hist.shift();future=[];updUndo();}
function undo(){if(!hist.length)return;future.push(snapState());clips=hist.pop();fixSel();renderAll();}
function redo(){if(!future.length)return;hist.push(snapState());clips=future.pop();fixSel();renderAll();}
function updUndo(){const u=$('#nUndo'),r=$('#nRedo');if(u){u.disabled=!hist.length;r.disabled=!future.length;}}
function fixSel(){if(!clips.find(c=>c.id===selId))selId=clips.length?clips[0].id:null;}
const selClip=()=>clips.find(c=>c.id===selId);

  if(v.dataset.rel!==rel){v.dataset.rel=rel;v.src='/media/'+encodeURIComponent(rel);v.onloadedmetadata=apply;}
  else apply();
}
function seekSeq(t){
  stopPlay();playN=clamp(t,0,seqDur());
  const m=locate(playN);if(!m){updatePh();return;}
  curIdx=m.idx;curSeg=m.seg;setSrc(m.rel,m.src,false,m.hflip);updatePh();
}
function enter(idx,seg,thenPlay){
  const sc=seqClips();curIdx=idx;curSeg=seg;
  const g=sc[idx].data.segments[seg];
  setSrc(g.src_rel,g.src_in,thenPlay,!!g.hflip);
}
function playTick(ts){
  if(!playing)return;
  const dt=(ts-lastTs)/1000;lastTs=ts;
  const sc=seqClips();if(!sc.length)return stopPlay();
  const v=vid();
  if(!switching&&!v.seeking){   // a pending seek still reports the OLD time — don't cascade boundaries
    const c=sc[curIdx],segs=c.data.segments,cur=v.currentTime;
    if(cur>=segs[curSeg].src_out-0.03){
      if(curSeg+1<segs.length)enter(curIdx,curSeg+1,true);
      else if(curIdx+1<sc.length){enter(curIdx+1,0,true);playN=offsetOf(curIdx);}
      else{stopPlay();playN=seqDur();updatePh();return;}
    }else{
      playN+=dt;
      const before=segs.slice(0,curSeg).reduce((a,g)=>a+segDur(g),0);
      const u=before+(cur-segs[curSeg].src_in);
      const real=offsetOf(curIdx)+clamp(u,0,clipDur(c));
      if(Math.abs(real-playN)>0.15)playN=real;
      playN=Math.min(playN,offsetOf(curIdx)+clipDur(c));
    }
  }
  updatePh();rafId=requestAnimationFrame(playTick);
}
function startPlay(){
  if(!seqClips().length)return;
  if(playN>=seqDur()-0.05)seekSeq(0);
  const m=locate(playN);curIdx=m.idx;curSeg=m.seg;
  playing=true;lastTs=performance.now();$('#tpPlay').textContent='⏸';
  setSrc(m.rel,m.src,true,m.hflip);rafId=requestAnimationFrame(playTick);
}
function stopPlay(){playing=false;if(rafId)cancelAnimationFrame(rafId);rafId=null;const v=vid();if(v)v.pause();const b=$('#tpPlay');if(b)b.textContent='▶';}
function updatePh(){
  const x=playN*PXPS;$('#nPh').style.transform=`translateX(${x}px)`;
  $('#tpTime').textContent=`${fmtT(playN)} / ${fmtT(seqDur())}`;
  if(playing){const sc=$('#ntlScroll');
    if(x<sc.scrollLeft+40||x>sc.scrollLeft+sc.clientWidth-40)sc.scrollLeft=x-sc.clientWidth/2;}
}
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`;

/* ---- timeline render ---- */
function niceStep(){const t=[0.5,1,2,5,10,15,30,60,120,300];for(const s of t)if(s*PXPS>=70)return s;return 600;}
function renderTimeline(){
  const inner=$('#ntlInner'),ruler=$('#nRuler'),lane=$('#nLane');
  const total=seqDur();
  if(autoFit&&total>0){const w=$('#ntlScroll').clientWidth-30;PXPS=clamp(w/total,3,120);$('#zoom').value=Math.round(PXPS);}
  inner.style.width=Math.max($('#ntlScroll').clientWidth,total*PXPS+60)+'px';
  ruler.innerHTML='';
  const step=niceStep();
  for(let s=0,n=0;s<=Math.ceil(total)+step&&n<2000;s+=step,n++){
    const t=document.createElement('div');t.className='tick';t.style.left=(s*PXPS)+'px';
    t.textContent=fmtT(s).replace(/\.0$/,'');ruler.appendChild(t);
  }
  lane.innerHTML='';
  const sc=seqClips();
  if(!sc.length){lane.innerHTML='<div class="ntl-empty">포함된 하이라이트가 없습니다 — 라이브러리에서 포함시키세요.</div>';}
  let x=0;
  sc.forEach((c,i)=>{
    const d=clipDur(c),w=Math.max(16,d*PXPS-2),segs=c.data.segments,two=segs.length>1;
    let sx=0;
    const segHtml=segs.map((sg,si)=>{const sw=segDur(sg)/d*w,left=sx;sx+=sw;return `<div class="nseg s${si%2}" style="left:${left}px;width:${sw}px"></div>${si<segs.length-1?`<div class="ncut" style="left:${sx}px" title="앵글 전환 — 크로스페이드 ${plan.crossfade_sec>0?plan.crossfade_sec+'s':'없음(하드컷)'}"></div>`:''}`;}).join('');
    const el=document.createElement('div');
    el.className='nclip'+(c.id===selId?' selected':'');
    el.style.left=x+'px';el.style.width=w+'px';el.dataset.id=c.id;el.draggable=true;
    el.innerHTML=`<canvas class="nwave"></canvas>
      ${segHtml}
      <div class="nlabel">${mmss(c.data.T)} · ${round(d,1)}s${c.data.goal_label?' · <span style="color:#37d67a;font-weight:700">GOAL</span>':''}${c.data.goal_cam?' · 🥅'+camName(c.data.goal_cam):''}${c.data.roi_only?` · <span style="color:#f0b429">ROI?${c.data.scan_conf!=null?' '+Math.round(c.data.scan_conf):''}</span>`:''}</div>
      <div class="ncams">${segs.map(s=>camName(s.cam)).join(' → ')}</div>
      <div class="trim l"></div><div class="trim r"></div>
      <button class="ndel" title="제외 (⌫)">✕</button>`;
    lane.appendChild(el);
    if(trimming&&c._waveHold){
      const cnv=el.querySelector('.nwave');
      cnv.style.display='none';
      el.style.backgroundImage=`url(${c._waveHold.url})`;
      el.style.backgroundRepeat='no-repeat';
      el.style.backgroundSize=`${c._waveHold.w}px ${c._waveHold.h}px`;
      el.style.backgroundPosition=`${c._waveHold.x||0}px 0`;
    }
    bindClip(el,c);
    ensureWave(c,el);
    x+=d*PXPS;
  });
  $('#nCnt').textContent=sc.length;$('#nTot').textContent=fmtT(total);
  const sel=selClip();const gl=$('#nGoalLbl');if(gl)gl.classList.toggle('on',!!(sel&&sel.data.goal_label));
  playN=Math.min(playN,total);updatePh();
}
function renderAll(){renderTimeline();renderLib();renderInsp();updUndo();}

/* ---- clip interactions: select / trim / cut / reorder / exclude ---- */
let trimming=false;
function bindClip(el,c){
  const segs=c.data.segments,two=segs.length>1;
  el.addEventListener('mousedown',ev=>{
    if(ev.target.matches('.trim,.ncut,.ndel'))return;
    selId=c.id;renderAll();
  });
  el.querySelector('.ndel').onclick=ev=>{ev.stopPropagation();pushHist();c.include=false;fixSel();renderAll();};
  const drag=(handle,apply)=>{
    handle.addEventListener('mousedown',ev=>{
      ev.preventDefault();ev.stopPropagation();selId=c.id;
      pushHist();trimming=true;
      const hold=el.querySelector('.nwave');
      const mode=handle.classList.contains('l')?'left':(handle.classList.contains('r')?'right':'cut');
      if(hold&&hold.width&&hold.height)c._waveHold={url:hold.toDataURL(),w:hold.width,h:hold.height,x:0,mode};
      const x0=ev.clientX,o=JSON.parse(JSON.stringify(segs));
      const mv=e=>{const dt=(e.clientX-x0)/PXPS;
        if(c._waveHold)c._waveHold.x=mode==='left'?-dt*PXPS:0;
        apply(dt,o);renderTimeline();renderInsp();};
      const up=()=>{trimming=false;delete c._waveHold;window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);renderAll();};
      window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
    });
  };
  drag(el.querySelector('.trim.l'),(dt,o)=>{segs[0].src_in=clamp(o[0].src_in+dt,0,segs[0].src_out-0.5);});
  drag(el.querySelector('.trim.r'),(dt,o)=>{const g=segs[segs.length-1],og=o[o.length-1];g.src_out=Math.max(g.src_in+0.5,og.src_out+dt);});
  const cut=el.querySelector('.ncut');
  if(cut)drag(cut,(dt,o)=>{ // move the angle switch: both cams in lockstep
    const nv=clamp(o[0].src_out+dt,segs[0].src_in+0.5,o[0].src_out+(o[1].src_out-o[1].src_in)-0.5);
    const d=nv-o[0].src_out;segs[0].src_out=nv;segs[1].src_in=Math.max(0,o[1].src_in+d);
  });
  el.addEventListener('dragstart',()=>{selId=c.id;});
  el.addEventListener('dragover',ev=>ev.preventDefault());
  el.addEventListener('drop',ev=>{
    ev.preventDefault();
    const from=clips.findIndex(k=>k.id===selId),to=clips.findIndex(k=>k.id===c.id);
    if(from<0||to<0||from===to)return;
    pushHist();const[m]=clips.splice(from,1);clips.splice(to,0,m);renderAll();
  });
  el.addEventListener('dblclick',()=>{seekSeq(offsetOf(seqClips().indexOf(c)));startPlay();});
}

/* ---- waveform inside clip blocks ---- */
async function ensureWave(c,el){
  if(!plan||!plan.audio_rel)return;
  const segs=c.data.segments;
  const key=JSON.stringify(segs.map(g=>[g.cam,round(g.src_in,1),round(g.src_out,1)]));
  const cnv=el.querySelector('.nwave');
  const draw=()=>{
    if(!c._wave)return;
    const w=el.clientWidth,h=el.clientHeight;if(!w)return;
    cnv.width=w;cnv.height=h;
    const g=cnv.getContext('2d');g.clearRect(0,0,w,h);g.fillStyle='rgba(160,172,188,.5)';
    const total=clipDur(c);let x=0;
    segs.forEach((sg,si)=>{
      const pk=c._wave[si];if(!pk){x+=segDur(sg)/total*w;return;}
      const segW=segDur(sg)/total*w,bw=segW/pk.length,mid=h/2;
      pk.forEach((p,i)=>{const bh=Math.max(1,p*(h-14));g.fillRect(x+i*bw,mid-bh/2,Math.max(1,bw-0.4),bh);});
      x+=segW;
    });
  };
  if(c._wkey===key&&c._wave){if(!trimming)draw();return;}
  if(trimming)return;   // keep the frozen waveform snapshot until mouseup
  try{
    const parts=[];
    for(const sg of segs){
      const rel=plan.audio_rel[sg.cam];
      if(!rel){parts.push(null);continue;}
      const n=clamp(Math.round(segDur(sg)*12),40,800);
      const r=await api(`/api/wave?path=${encodeURIComponent(rel)}&t0=${round(sg.src_in,2)}&t1=${round(sg.src_out,2)}&n=${n}`);
      parts.push(r.peaks);
    }
    c._wave=parts;c._wkey=key;draw();
  }catch(e){}
}

/* ---- library / inspector ---- */

  // Library-only reordering for review (the timeline sequence stays time-ordered).
  // 'conf' sorts strongest ROI net-hit first so you can review top-down and stop

/* ---- angle configuration: single-cam or ordered two-angle setup ----
   All cams share one real-time axis via plan.offsets (camA-time = src - offset),
   so segments can be rebuilt for any cam order without losing the moment. */
function camMap(){
  const m={};
  clips.forEach(c=>c.data.segments.forEach(g=>{m[g.cam]={src:g.src,src_rel:g.src_rel,hflip:!!g.hflip};}));
  return m;
}
function currentOrder(c){return c.data.segments.map(g=>g.cam);}
function setAngles(c,order){
  const off=cam=>(plan.offsets&&plan.offsets[cam])||0;
  const m=camMap(),segs=c.data.segments;
  const t0=segs[0].src_in-off(segs[0].cam);
  const te=segs[segs.length-1].src_out-off(segs[segs.length-1].cam);
  // keep the existing switch point; when coming FROM single-cam, default to T+2s
  let tc=segs.length>1?segs[0].src_out-off(segs[0].cam):clamp(c.data.T+2,t0+0.5,te-0.5);
  tc=clamp(tc,t0+0.5,te-0.5);
  const mk=(cam,a,b)=>({cam,src:m[cam].src,src_rel:m[cam].src_rel,hflip:!!m[cam].hflip,
                        src_in:Math.max(0,a+off(cam)),src_out:b+off(cam)});
  c.data.segments=order.length===1?[mk(order[0],t0,te)]:[mk(order[0],t0,tc),mk(order[1],tc,te)];
  c._wave=null;c._wkey=null;   // waveform must refetch for the new cams
}

      <div class="kv mut">${segs.map(s=>camName(s.cam)).join(' → ')} · ${round(clipDur(c),1)}s</div>

      <div class="kv">in <input type="number" step="0.1" data-n="in" value="${round(segs[0].src_in,2)}">

        <button class="tbtn" data-set="cut" title="재생점을 컷으로 (C)">=재생점</button></div>`:''}
      <div class="kv">out <input type="number" step="0.1" data-n="out" value="${round(segs[segs.length-1].src_out,2)}">
        <button class="tbtn" data-set="out" title="재생점을 아웃으로 (O)">=재생점</button></div>
    </div>

  const apply=f=>{pushHist();f();renderAll();};

  ang.innerHTML=orders.map(o=>{

  }).join('');
  ang.querySelectorAll('[data-ang]').forEach(b=>b.onclick=()=>apply(()=>setAngles(c,b.dataset.ang.split(','))));
  box.querySelector('[data-n="in"]').onchange=e=>apply(()=>{segs[0].src_in=clamp(parseFloat(e.target.value)||0,0,segs[0].src_out-0.5);});
  const ci=box.querySelector('[data-n="cut"]');
  if(ci)ci.onchange=e=>apply(()=>{const v=parseFloat(e.target.value)||0,d=v-segs[0].src_out;segs[0].src_out=v;segs[1].src_in=Math.max(0,segs[1].src_in+d);});
  box.querySelector('[data-n="out"]').onchange=e=>apply(()=>{const g=segs[segs.length-1];g.src_out=Math.max(g.src_in+0.5,parseFloat(e.target.value)||0);});
  box.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>setAtPlayhead(b.dataset.set));
  box.querySelector('[data-act="play"]').onclick=()=>{if(!c.include)return;seekSeq(offsetOf(seqClips().indexOf(c)));startPlay();};
  box.querySelector('[data-act="tog"]').onclick=()=>apply(()=>{c.include=!c.include;});
  box.querySelector('[data-act="dup"]').onclick=()=>apply(()=>{
    const i=clips.indexOf(c);
    clips.splice(i+1,0,{id:nextId++,include:true,data:JSON.parse(JSON.stringify(c.data))});
  });
}
function setAtPlayhead(which){
  const m=locate(playN);if(!m)return;
  const c=m.clip;selId=c.id;const segs=c.data.segments;
  pushHist();
  if(which==='in'&&m.seg===0)segs[0].src_in=clamp(m.src,0,segs[0].src_out-0.5);
  else if(which==='out'){const g=segs[segs.length-1];if(m.seg===segs.length-1)g.src_out=Math.max(g.src_in+0.5,m.src);}
  else if(which==='cut'&&segs.length>1){
    const u=m.seg===0?m.src-segs[0].src_in:segDur(segs[0])+(m.src-segs[1].src_in);
    const nv=clamp(segs[0].src_in+u,segs[0].src_in+0.5,segs[0].src_out+segDur(segs[1])-0.5);
    const d=nv-segs[0].src_out;segs[0].src_out=nv;segs[1].src_in=Math.max(0,segs[1].src_in+d);
  }
  renderAll();
}

/* ---- blade: split the clip under the playhead into two independent clips ---- */
function bladeAtPlayhead(){
  const m=locate(playN);if(!m)return;
  const c=m.clip,segs=c.data.segments,seg=m.seg,cut=m.src,cur=segs[seg];
  // need >= 0.5s on each side of the cut WITHIN this segment (no zero-length pieces,
  // and can't blade exactly on an angle-cut boundary)
  if(cut-cur.src_in<0.5||cur.src_out-cut<0.5)return;
  const off=cam=>(plan.offsets&&plan.offsets[cam])||0;
  const clone=s=>({...s});
  const aSegs=segs.slice(0,seg).map(clone).concat([{...clone(cur),src_out:cut}]);
  const bSegs=[{...clone(cur),src_in:cut}].concat(segs.slice(seg+1).map(clone));
  const mk=pieceSegs=>({id:nextId++,include:true,data:{
    ...JSON.parse(JSON.stringify(c.data)),segments:pieceSegs,
    T:pieceSegs[0].src_in-off(pieceSegs[0].cam),  // label each piece by its own start
    roi_only:false,goal_label:false}});   // a hand-cut piece is no longer an auto goal marker
  const a=mk(aSegs),b=mk(bSegs);
  // the goal overlay (if any) stays with whichever piece still contains T
  if(c.data.goal_label){const gt=c.data.T+off(segs[0].cam);(gt<=cut?a:b).data.goal_label=true;
    (gt<=cut?a:b).data.T=c.data.T;}
  pushHist();
  const idx=clips.findIndex(k=>k.id===c.id);
  clips.splice(idx,1,a,b);
  selId=b.id;renderAll();
}

/* ---- GOAL overlay label: mark the selected clip so the render burns in "GOAL".
   Store goal_at = seconds into the clip where the goal happens, computed here where
   plan.offsets is available (renderer overlays the PNG at that offset, no offsets
   needed downstream). ---- */
function toggleGoalLabel(){
  const c=selClip();if(!c)return;
  pushHist();
  c.data.goal_label=!c.data.goal_label;
  if(c.data.goal_label){
    const off=cam=>(plan.offsets&&plan.offsets[cam])||0;
    const segs=c.data.segments;
    const clipStartCamA=segs[0].src_in-off(segs[0].cam);
    c.data.goal_at=clamp(c.data.T-clipStartCamA,0,clipDur(c));
  }
  renderAll();
}

/* ---- shell bindings: transport, ruler, skim, zoom, keys ---- */
function bindShell(){
  $('#tpPlay').onclick=()=>playing?stopPlay():startPlay();
  $('#tpStart').onclick=()=>seekSeq(0);
  $('#tpEnd').onclick=()=>seekSeq(seqDur());
  $('#tpPrev').onclick=()=>{const p=editPoints();for(let i=p.length-1;i>=0;i--)if(p[i]<playN-0.01)return seekSeq(p[i]);seekSeq(0);};
  $('#tpNext').onclick=()=>{for(const p of editPoints())if(p>playN+0.01)return seekSeq(p);};
  const snapT=t=>{
    if(!snapOn)return t;
    let best=t,bpx=8;
    for(const p of editPoints()){const d=Math.abs(p-t)*PXPS;if(d<bpx){bpx=d;best=p;}}
    return best;
  };
  const rulerT=cx=>{const r=$('#ntlInner').getBoundingClientRect();return clamp((cx-r.left)/PXPS,0,seqDur());};
  let phDrag=false;
  $('#nRuler').addEventListener('mousedown',e=>{phDrag=true;seekSeq(snapT(rulerT(e.clientX)));});
  $('#nPhHead').addEventListener('mousedown',e=>{e.stopPropagation();phDrag=true;});
  window.addEventListener('mousemove',e=>{if(phDrag)seekSeq(snapT(rulerT(e.clientX)));});
  window.addEventListener('mouseup',()=>phDrag=false);
  // skimming: hover over the ruler area scrubs lightly (no state change)
  $('#ntlScroll').addEventListener('mousemove',e=>{
    if(phDrag||trimming||playing)return void($('#nSkim').style.display='none');
    const t=rulerT(e.clientX);$('#nSkim').style.display='block';$('#nSkim').style.left=(t*PXPS)+'px';
  });
  $('#ntlScroll').addEventListener('mouseleave',()=>$('#nSkim').style.display='none');
  $('#nSnap').onclick=()=>{snapOn=!snapOn;$('#nSnap').classList.toggle('on',snapOn);};
  $('#nBlade').onclick=bladeAtPlayhead;
  $('#nGoalLbl').onclick=toggleGoalLabel;
  const ls=$('#libSort');if(ls)ls.onchange=renderLib;
  const applyZoom=v=>{PXPS=clamp(v,3,120);$('#zoom').value=Math.round(PXPS);renderTimeline();};
  $('#zoom').oninput=e=>{autoFit=false;applyZoom(+e.target.value);};
  $('#zIn').onclick=()=>{autoFit=false;applyZoom(PXPS*1.3);};
  $('#zOut').onclick=()=>{autoFit=false;applyZoom(PXPS/1.3);};
  $('#zFit').onclick=()=>{autoFit=true;renderTimeline();};
  $('#ntlScroll').addEventListener('wheel',e=>{     // pinch-zoom at cursor (webcut)
    if(!e.ctrlKey)return;e.preventDefault();
    const sc=$('#ntlScroll'),sx=e.clientX-sc.getBoundingClientRect().left;
    const tAt=(sc.scrollLeft+sx)/PXPS;autoFit=false;
    applyZoom(PXPS*Math.exp(-e.deltaY*0.01));
    sc.scrollLeft=Math.max(0,tAt*PXPS-sx);
  },{passive:false});
  $('#nUndo').onclick=undo;$('#nRedo').onclick=redo;
  window.onkeydown=e=>{
    if(!$('#edit')||$('#edit').hidden||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    const meta=e.metaKey||e.ctrlKey;
    if(meta&&(e.key==='z'||e.key==='Z')){e.preventDefault();e.shiftKey?redo():undo();return;}
    switch(e.key){
      case ' ':e.preventDefault();playing?stopPlay():startPlay();break;
      case 'i':case 'I':setAtPlayhead('in');break;
      case 'o':case 'O':setAtPlayhead('out');break;
      case 'c':case 'C':setAtPlayhead('cut');break;
      case 'b':case 'B':bladeAtPlayhead();break;
      case 'g':case 'G':toggleGoalLabel();break;
      case 'n':case 'N':$('#nSnap').click();break;
      case 'ArrowLeft':e.preventDefault();seekSeq(playN-(e.shiftKey?1:1/30));break;
      case 'ArrowRight':e.preventDefault();seekSeq(playN+(e.shiftKey?1:1/30));break;
      case 'ArrowUp':e.preventDefault();$('#tpPrev').click();break;
      case 'ArrowDown':e.preventDefault();$('#tpNext').click();break;
      case 'Backspace':case 'Delete':{const c=selClip();if(c){pushHist();c.include=false;fixSel();renderAll();}break;}
    }
  };
}

/* ---- render job ---- */
async function startRender(){
  if(window._loadingPlan){$('#edRstat').textContent='분석이 끝난 뒤 렌더할 수 있습니다';return;}
  window._edOut=$('#edOut').value;window._edBgm=$('#edBgm').value;window._edVol=$('#edVol').value;
  const tail=Math.max(0,parseFloat(window._edTail)||0);
  const renderClips=seqClips().map(c=>JSON.parse(JSON.stringify(c.data)));
  if(tail>0){
    renderClips.forEach(c=>{const g=c.segments[c.segments.length-1];g.src_out+=tail;});
  }
  const out={...plan,fps:parseInt(window._edFps,10)||60,crossfade_sec:Math.max(0,parseFloat($('#edXf').value)||0),clips:renderClips,render_tail_sec:tail};
  if(!out.clips.length){$('#edRstat').textContent='포함된 클립이 없습니다';return;}
  const renderBtn=$('#edRender');
  if(renderBtn)renderBtn.disabled=true;
  $('#edProgWrap').hidden=false;$('#edProg').style.width='0%';$('#edRstat').textContent='렌더 시작…';
  const jobToken=window.beginJobPanel?window.beginJobPanel('render','렌더','렌더 준비 중',0):null;
  try{
    const r=await api('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({plan:out,out:window._edOut,filename:window._edFile,bgm:window._edBgm||null,bgm_volume:parseFloat(window._edVol)})});
    const poll=async()=>{
      try{
        const s=await api('/api/render_status?job='+r.job);
        if(s.status==='running'){const[i,n]=s.progress||[0,1];
          const pct=s.percent??Math.round(i/Math.max(1,n)*100);
          $('#edProg').style.width=pct+'%';
          $('#edRstat').textContent=s.stage||`렌더 ${i}/${n}`;
          if(window.updateJobPanel)window.updateJobPanel(jobToken,'렌더',s.stage||`렌더 ${i}/${n}`,pct);
          setTimeout(poll,1000);}
        else if(s.status==='done'){$('#edProg').style.width='100%';
          $('#edRstat').textContent=`✓ 최종 파일 → ${s.output||window._edOut}`;
          if(window.updateJobPanel)window.updateJobPanel(jobToken,'렌더','완료',100);
          if(window.endJobPanel)window.endJobPanel(jobToken,1200);
          if(renderBtn)renderBtn.disabled=false;}
        else {$('#edRstat').textContent='오류: '+(s.error||'unknown');
          if(window.updateJobPanel)window.updateJobPanel(jobToken,'렌더 실패',s.error||'unknown',100);
          if(renderBtn)renderBtn.disabled=false;}
      }catch(e){$('#edRstat').textContent='상태 조회 실패: '+e.message;if(renderBtn)renderBtn.disabled=false;}
    };
    poll();
  }catch(e){$('#edRstat').textContent='오류: '+e.message;if(renderBtn)renderBtn.disabled=false;}
}
loadState();
</script>
